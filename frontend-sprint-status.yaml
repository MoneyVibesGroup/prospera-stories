OpenAPI servi : POST|DELETE /organizations/me/logo + brandColor ; sanitizer SVG durci en 3 passes de revue sécurité). L'UI garde son propre garde-fou : logo rendu via <img> uniquement, jamais de SVG inline. Historique : 🆕 2026-07-22 (demande PO). OrganizationResponseDto porte id/name/slug/phone/country/address/status : NI logo NI couleur, et aucune route d'upload. ⚠️ garde-fou de périmètre acté : la couleur habille le logo par défaut et les DOCUMENTS PRODUITS, elle ne repeint pas la navigation de Prospera. ⚠️ si le backend accepte les SVG, ne jamais les injecter en ligne dans le DOM." }

  # ── S5 : allumer un module — LA boucle qui justifie toute la topologie ─────────────────
