t symétrique de celui que la v3.2.0 documentait la veille. ⚡ IMPACT MESURÉ : **15 fichiers** de `src/features/atelier` portent `debit`/`credit`, et le **test de parité de checksum de FE-026 va casser** (`1864781c…`). ⇒ **FE-057 RÉÉCRITE ET RÉESTIMÉE 2→5 pts** : elle absorbe la migration ET les 3 écarts d'origine (impossible de les séparer — une seule régénération casse les 15 fichiers d'un coup). S7 : 21→24 pts. ⚡ VALEUR MÉTIER, pas seulement du retrofit : le double équilibre rend visible le **déséquilibre de soldes seul**, que le contrat à 2 colonnes laissait passer en silence. ⏳ RESTE OUVERT côté backend pour l'Atelier : STORY-146 (format de compte, `ready-for-dev`) et STORY-145 (validation d'une balance, `ready-for-dev`) — cette dernière conditionne toujours l'action absente de FE-027. — HISTORIQUE : 🏁 v3.3.0 (2ᵉ entrée du 2026-07-31) — LA CONSOLE ADMIN EXISTE : AP-01→AP-05 SONT MERGÉES DANS `dev` de `frontend-admin-panel` (commit 111e3b1, PR #4 et #5 du 31/07). ⚠️ CECI INVALIDE L'AFFIRMATION CENTRALE DE LA v3.2.0 ÉCRITE LE MATIN MÊME — « LE GOULOT N'EST PLUS LE BACKEND : c'est AP-01 […] il n'y a AUCUNE UI. 11 stories admin (AP-02→AP-11) + FE-017 attendent 5 points de socle ». C'EST FAUX. La v3.2.0 a vérifié `prospera-admin-panel-service` (le BFF NestJS) et en a conclu qu'aucune UI n'existait — mais l'UI n'a JAMAIS eu vocation à vivre dans ce dépôt : elle est dans **`frontend-admin-panel`** (Next.js 16), dépôt DISTINCT, où AP-01 (socle + login PLATFORM_ADMIN), AP-02 (organisations), AP-03 (revue KYC), AP-04 (catalogue) et AP-05 (entitlements) sont livrées et mergées. 🪤 TROISIÈME OCCURRENCE DU MÊME PIÈGE, dans sa forme la plus coûteuse : les entrées du 2026-07-28 (3) et (4) prescrivaient déjà « vérifier LES DEUX BOUTS de l'appel » ; ici la vérification a porté sur le bon SERVICE mais sur le mauvais DÉPÔT, et en a tiré un goulot d'étranglement imaginaire qui aurait réorienté un sprint entier vers une story déjà faite. ⇒ RÈGLE AJOUTÉE : avant de déclarer une UI absente, ouvrir le dépôt FRONTEND concerné — jamais son service d'appui. Les deux dépôts admin ont des noms voisins (`prospera-admin-panel-service` = BFF ; `frontend-admin-panel` = console) et c'est précisément ce qui fait glisser. 📊 CONSÉQUENCE DE PLANIFICATION : les 11 stories admin ne sont PAS en attente d'AP-01 — S3 SOLDÉ, volets admin du S4 et du S5 SOLDÉS. ⚠️ NUANCE QUI COMPTE PLUS QUE LES STATUTS : les 5 écrans tournent sur des **FIXTURES** — `orgs-client.ts`, `catalog-client.ts`, `entitlements-client.ts` et `kyc-client.ts` lisent des tableaux en mémoire derrière un `delay(220)`, aucun `apiFetch` métier, `gen:api` JAMAIS lancé sur ce dépôt. La console est donc RÉELLE mais MUETTE : la boucle DG-1 (l'admin octroie → le module s'allume côté client) n'est PAS démontrable, et FE-017 reste bloquée — pour CETTE raison, plus pour « le front n'existe pas ». Le découplage est propre (un seul fichier de bascule par feature, chaque fonction porte son TODO(backend)), mais la dette est réelle et elle grandit à chaque écran ajouté par-dessus — c'est exactement ce que le principe de priorité nº2 interdit. ⇒ **UN INTEGRATION GATE ADMIN RESTE À CRÉER** : l'équivalent de FE-INT-0 pour la console (gen:api sur les 4 services, bascule des 4 clients, preuve navigateur contre le stack docker). C'est LE prochain jalon de la console et il n'a pas encore d'identifiant. 🔤 RENUMÉROTATION : les STORY-145/146 rédigées le 28/07 (référentiel conditionnel au module · dépôt d'un paquet de référentiel par la console) deviennent **STORY-148/149** — les numéros 145/146/147 ont été pris en parallèle par la série `balance-service` poussée sur `origin/main`, qui fait foi ; le code mergé référençant 145/146 a été mis à jour en conséquence. — 🔄 v3.2.0 — RÉANCRAGE MASSIF SUR LE CODE (le tracker avait 3 jours de retard et le backend a livré 9 stories les 29-30/07) : **15 stories passent de `blocked` à `ready-for-dev`**. Côté Atelier/Bilan : FE-036→039 (069→074 done), FE-040→042 (078→081 done), FE-043→046 (0