    stories:
      - { id: "AP-08", app: "admin", title: "RBAC plateforme : membres (invitation org-less + attribution de rôle) + composition de rôles depuis le catalogue de permissions + masquage d'UI sur perms[] (amende AP-01)", epic: "AP-EPIC-000", points: 8, status: "review", backend_ready: "done", backend_ref: "STORY-103,104,105,106", note: "🏁 LIVRÉE 2026-08-09 sur la branche `ap-08` (maquette dérivée d'AP-12 + code + Integration Gate). ⚡ TROIS ÉCARTS TROUVÉS EN SONDANT LE VRAI BACKEND AVANT DE CODER, tous en faveur du backend : (1) le catalogue compte **13** permissions et non 8 (ni 12) — `referentiel:publish' s'est ajouté ; (2) il y a **7 rôles système** seedés et non 3 — les rôles métier Comptable/Marketing/DG demandés le 2026-07-28 EXISTENT DÉJÀ (STORY-140), aucune mécanique frontend n'était à inventer pour eux ; (3) l'AC nº7 est mal formulé — `assertCanGrant` est une inclusion (cible ⊆ détenu), donc un acteur {role:manage, org:read} doit se voir proposer LES DEUX ; implémenté selon le garde-fou, pas selon la phrase. ⚡ L'AC nº3 n'a PAS eu à être corrigé de 8 → 13, et c'est le point de conception : l'écran LIT le catalogue au lieu de le recopier, avec un groupe « autres » qui recueille toute permission inconnue de ses domaines — une 14ᵉ apparaîtra sans qu'une ligne de front change (testé). ⛔ DEUX ÉCARTS DE CONTRAT À CORRIGER CÔTÉ BACKEND, tracés : (a) **le Swagger du BFF ne déclare aucun `type:` de réponse** — ses `@ApiOkResponse({description})` sont sans schéma, donc `openapi-typescript` produit `content?: never` sur les 6 routes et AUCUN consommateur ne peut se typer sur le BFF ; contournement appliqué : les types viennent de la spec de l'IdP (PlatformRoleDto/PermissionCatalogItemDto/PaginatedUsersDto), que le BFF traverse fidèlement — l'AC nº12 est tenu, mais par le bon des deux fichiers générés ; (b) **POST /admin/users (201) omet firstName/lastName** alors que UserResponseDto les déclare requis — l'écran ne lit donc rien de ce corps et recharge la liste ; un test du gate CONSTATE l'écart au lieu de le contourner. ✅ GARDE-FOUS CONFIRMÉS EN LIVE (non supposés) : 403 sur PATCH/DELETE d'un rôle système · 400 sur `isSystem` en POST · 400 sur `name` en PATCH (c'est ce qui justifie l'absence de champ « renommer », remplacé par l'encart « chemin sûr » créer→réattribuer→supprimer) · 409 sur la suppression d'un rôle porté par un INVITÉ · 409 anti-lockout sur le dernier PLATFORM_ADMIN actif · 404 sur un compte sans platformRole (anti-énumération : aucun geste « promouvoir ce membre du cabinet » n'existe) · invitation org-less reçue dans Mailhog · TTL de jeton à 900 s, donc les « 15 min » annoncées à l'écran sont exactes. 🎨 DEUX DÉCISIONS DE CONCEPTION VALIDÉES PO : l'anti-lockout est le SEUL grisage assumé de la console (partout ailleurs une action non permise disparaît, règle d'AP-20 — ici la cause est un ÉTAT, pas un droit manquant, et faire disparaître le bouton ferait chercher la permission à cocher) ; et pas de champ « renommer », remplacé par un bouton « composer un rôle jumeau ». 📊 MASQUAGE MIGRÉ SUR perms[] au-delà de cette story (AC10) : nav (`visibleNavItems`), KYC (`kyc:approve` ET `kyc:reject` SÉPARÉMENT — l'issue consolidée décide de la permission requise), entitlements (grant/revoke séparément), catalogue (`catalog:manage` vs `referentiel:publish`, que STORY-140 a précisément séparées). ✅ 52 tests unitaires · typecheck OK · lint 0 erreur · +`components/ui/checkbox.tsx` (le socle n'en avait pas : aucun écran n'avait eu besoin d'un choix multiple avant la composition d'un rôle) · section i18n `rbac` complète. 🪤 DEUX PIÈGES REJOUÉS : le générateur de barils de l'IDE a produit 6 `index.ts` fantômes dont deux sous `src/app/` — ils sont **git-ignorés**, donc INVISIBLES de `git ls-files --others --exclude-standard`, mais `tsc` les compile ; diagnostic = `git ls-files --others --ignored --exclude-standard -- src/**/index.ts`. Et le `37px` codé en dur du socle de maquette AP-12 n'était pas la hauteur du bandeau (46 px, 77 px en étroit) : appbar et logo se rangeaient SOUS lui. ⏳ RESTE TRACÉ (hors périmètre) : le décompte d'administrateurs actifs est calculé sur la PAGE et non sur le parc (approximation bornée — l'anti-lockout de l'IdP fait autorité) ; et l'e2e ne peut pas OUVRIR une session de délégué (un invité est INVITED, et un jeton RS256 ne se forge pas) — la délégation est prouvée par les refus réels sur les routes, un seed d'opérateur délégué ACTIVÉ la rendrait démontrable de bout en bout. — HISTORIQUE : 🔓 DÉBLOQUÉE 2026-07-28 — STORY-106 est LIVRÉE. La story pariait sur sa sortie et le pari a été tenu LE JOUR MÊME (2026-07-17, 🏁 EPIC-025 clos) ; le statut n'a jamais été réancré et elle est restée `blocked` sur une phrase pendant onze jours. Vérification faite — celle que la story prescrivait elle-même : origin/dev de prospera-admin-panel-service est à 0521258 (plus 52c6f23), `grep -r RequirePermissions src/` RENVOIE DES RÉSULTATS (il était vide), les 6 routes déclarées manquantes EXISTENT (GET /admin/permissions ; GET|POST /admin/roles ; PATCH|DELETE /admin/roles/:name ; PATCH /admin/users/:id) et le gating est en place (@RequirePermissions ROLE_MANAGE + USER_INVITE). ⚡ C'EST CETTE STORY QUI PORTE LES RÔLES INTERNES Comptable/Marketing/DG demandés le 2026-07-28 — aucune story frontend n'a été créée pour eux, la mécanique est ici. Son AC nº3 passera de 8 à 12 permissions après STORY-140. — HISTORIQUE : 🆕 2026-07-17 — GAP MAJEUR : le backend a livré D15/EPIC-025 (103/104/105 done le 2026-07-16 : catalogue de 8 permissions AVEC libellés, rôles système seedés non supprimables, perms[] dans le JWT, CRUD rôles, invitation plateforme org-less POST /admin/users, PATCH du rôle d'un opérateur) et AUCUNE story frontend ne le couvrait — alors que STORY-104 expose les libellés EXPLICITEMENT pour un panel. ⚠️ BLOQUÉE par STORY-106 : sans le proxy BFF, le front n'a aucune route vers /admin/roles et /admin/users, et le gating perms[] resterait COSMÉTIQUE (le BFF refuse tout non-PLATFORM_ADMIN à sa propre porte). Garde-fous backend à refléter dans l'UI : anti god-mode (on ne peut pas octroyer une permission qu'on n'a pas), anti-lockout (dernier PLATFORM_ADMIN), `name` de rôle non éditable (renommer = créer+réattribuer+supprimer)." }
