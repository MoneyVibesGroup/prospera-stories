    stories:
      - { id: "AP-02", app: "admin", title: "Vue agrégée des organisations (identité + KYC + entitlements, list + détail, dégradation partielle)", epic: "AP-EPIC-001", points: 5, status: "review", backend_ready: "done", backend_ref: "STORY-047,027,033", note: "✅ LIVRÉE — mergée dans `dev` (commits `3016a4b`/`bba2c5b`). Liste filtrable + fiche détail, chaque source indépendante : une source en échec sert son `lastKnown` DATÉ plutôt qu'un écran vide, parce qu'une fiche vide ne dit pas « je ne sais pas », elle dit « il n'y a rien ». ⚠️ SUR FIXTURES (`orgs-client.ts`) — cf. entête v3.3.0. ⚠️ DETTE OUVERTE : les actions de ligne et la barre d'actions groupées n'appellent RIEN (toast seul) — c'est **STORY-144**, rédigée et `draft`, non planifiée." }
      - { id: "AP-03", app: "admin", title: "Revue KYC (file, détail + pièces via URL présignée, comparaison OCR déclaré↔lu, approve/reject + motif)", epic: "AP-EPIC-001", points: 8, status: "review", backend_ready: "done", backend_ref: "STORY-013,045,048,105,107", note: "✅ LIVRÉE 2026-07-31 — mergée dans `dev` (commit `0dfedf9`, PR #5). ⚡ AMENDEMENT DE NAVIGATION NON PRÉVU PAR LA STORY, à acter ou à contester : l'entrée de nav dédiée « Revue KYC » est RETIRÉE ; la file devient un ONGLET de /organisations. Motif : la file n'est pas un écran de plus mais une VUE du même read-model — deux portes vers un contenu unique obligeaient l'admin à deviner laquelle ouvrir. Le compteur de dossiers en attente est chargé MÊME sur l'annuaire (c'est le chiffre qui décide d'aller voir la file ou non). Annuaire et file gardent deux tableaux distincts : l'annuaire RÉPERTORIE, la file ORDONNE par ancienneté. MODÈLE DE DÉCISION (`consolidate`), deux règles protectrices du cabinet : (1) une pièce manquante ou refusée donne « À compléter », JAMAIS « Rejeté » — le rejet est un acte global et délibéré qui oblige à tout reprendre, une page floue ne le justifie pas ; (2) on ne soumet que lorsque CHAQUE pièce présente est marquée, pour éviter les corrections à tiroirs. DISTINCTIONS TENUES : `fix` (reproche au CONTENU, motif ≥10 car. obligatoire) vs `unreadable` (le fichier ne s'ouvre pas — exiger un motif reviendrait à faire justifier une panne) ; `missing`/`corrupt` sont des EMPÊCHEMENTS, pas des refus ; invariant DO-1 respecté (la confrontation OCR ne porte AUCUN verdict, l'humain tranche) ; conflit d'opérateurs rendu explicite (qui a décidé quoi) au lieu d'un écrasement silencieux. ⚠️ SUR FIXTURES (`kyc-client.ts`) — cf. entête v3.3.0. ⚠️ STORY-107 RESTE NÉCESSAIRE : la jointure raison sociale × dossier est faite côté client, elle sera fausse au-delà d'une page. — HISTORIQUE : ⬆️ RÉVISÉE 5→8 : l'enrichissement OCR (STORY-045) n'était pas au périmètre d'origine et c'est le cœur de la valeur — le BFF expose extraction{extracted,declared,discrepancies,flags{expired,unreadable},confidence,ocrProvider} par pièce + ocrSummary{hasDiscrepancies,anyUnreadable,anyExpired,extractedCount} par dossier. ⚠️ INVARIANT DO-1 : l'OCR est une ASSISTANCE, purement informative — l'UI ne doit jamais laisser croire qu'il décide ; l'humain tranche. ✅ CORRECTION 2026-07-17 (ma note précédente était FAUSSE sur 2 points, vérifiés dans le code) : (a) le BFF CONSOMME bien la file (kyc-service.client.listReviewQueue → GET /admin/kyc) et le détail, il ne faut donc rien réclamer de ce côté ; (b) les URLs présignées SONT exposées (KycDocument.url, traversée telle quelle, jamais journalisée) — je les avais dites « à vérifier ». ⚠️ SEUL VRAI ÉCART RESTANT : GET /admin/orgs enrichit chaque ligne d'un kycStatus (AdminOrgListItemDto) mais son filtre `status` porte sur l'IDENTITÉ (IDENTITY_STATUSES = ACTIVE|SUSPENDED), PAS sur le KYC ⇒ pas de filtrage serveur « en attente de revue » : le front devrait filtrer côté client À TRAVERS la pagination (faux dès que le volume croît). ✅ DEMANDE BACKEND FORMULÉE = **STORY-107** (3 pts, sprint 10 backend, à tirer avec 106) : exposer une route de file dans le BFF qui relaie `GET /admin/kyc?status=` (kyc-service SAIT DÉJÀ filtrer) + joint la raison sociale. ⚠️ Ma 1ʳᵉ formulation (« ajouter kycStatus à ListOrgsQueryDto ») était la MAUVAISE FORME : elle inverserait la source de pagination (auth pilote la page, le kycStatus est enrichi APRÈS). SANS 107, AP-03 reste livrable — le DÉTAIL est entièrement servi — mais la file serait fausse au-delà d'une page." }
      - { id: "FE-015", app: "client", title: "Profil du cabinet + Mon profil (GET|PATCH /organizations/me, GET /users/me) + retrofit identité du shell", epic: "FE-EPIC-002", points: 4, status: "review", backend_ready: "done", backend_ref: "STORY-023,026", note: "✅ 2026-07-22 — **PR #13 `fe-015`→`dev`**. Livrée sur le périmètre RÉELLEMENT servi ; maquette validée par le PO après 4 itérations. CONTENU : /parametres/cabinet (admin — en-tête d'identité + complétude qui NOMME ce qui manque, formulaire groupé n'envoyant QUE les champs modifiés, 400 routés au champ, pièces en lecture seule, slug/statut hors formulaire car PATCH dessus = 400) ; /mon-profil (2 rôles — identité, sécurité, thème réellement branché, cabinet) ; collaborateur sur /parametres/cabinet → REDIRECTION vers /mon-profil (décision PO, pas d'écran d'erreur) ; bloc d'activation RETIRÉ des 2 écrans (il pilote l'onboarding, pas la consultation) ; retrofit du shell (fin de DEMO_USER et « Cabinet Diallo »). ⚠️ BUG CORRIGÉ EN CHEMIN : le JWT porte `roles: string[]`+`perms[]`, pas un `role` scalaire → decodeClaims renvoyait toujours undefined ⇒ AUCUN admin ne voyait l'entrée « Utilisateurs » ; le stub E2E reproduisait la même hypothèse fausse. VÉRIF LIVE : complétude 33→67 %, PATCH avec la charge utile {phone} SEULE → 200, zéro erreur réseau. E2E profile.spec 5/5. NON LIVRÉ faute de backend, tracé en stories : aperçu pièces + date de validation (FE-022), logo/couleur (FE-023), sessions (FE-021), édition profil/mot de passe (FE-019/020)." }
      - { id: "FE-016", app: "client", title: "Renvoi d'invitation à un membre (POST /users/:id/resend-invitation)", epic: "FE-EPIC-002", points: 2, status: "review", backend_ready: "done", backend_ref: "STORY-008,026", note: "✅ 2026-07-22 — **PR #14**. Contrat CONFRONTÉ avant de coder : INVITED→200 ; ACTIVE→409 ; **id inconnu→409 AUSSI (pas 404)** donc l'UI ne peut pas distinguer les deux cas ; ⚠️ **AUCUN THROTTLE** (4 appels = 4 e-mails, alors que resend-verification en a un) → verrou de 30 s côté client, à retirer quand le backend limitera la cadence. ⚠️ À MERGER APRÈS LA PR #13 : sans le correctif roles[] du JWT, /users affiche « accès réservé » à un vrai admin et la fonctionnalité est invisible." }
      - { id: "FE-018", app: "client", title: "Le cabinet voit ce que l'OCR a lu de ses pièces (déclaré↔lu) — GET /documents/:id/extraction", epic: "FE-EPIC-003", points: 3, status: "review", backend_ready: "done", backend_ref: "STORY-044,045", note: "✅ 2026-07-22 — **PR #15**. ⚡ PLACEMENT CORRIGÉ PAR LE PO : la lecture est déclenchée par le DÉPÔT → le bloc s'affiche DANS la carte du document (écran KYC), pas dans un onglet séparé (ma 1ʳᵉ maquette en avait fait une page, ce qui trahissait le moment réel). Types GÉNÉRÉS depuis l'OpenAPI :3006 (document-service ajouté à gen:api). ⚠️ extracted/declared/discrepancies = SACS DE CLÉS LIBRES (additionalProperties) ⇒ le tableau parcourt l'UNION des clés, aucun champ codé en dur ; les divergences signalées par le backend priment sur la comparaison naïve (lui seul normalise accents/casse). 404 = analyse en cours (reprise 8 s, jamais d'erreur) ; 403/réseau = bloc muet. Invariant DO-1 verrouillé par test : même sans écart, l'écran dit que cela ne vaut pas validation. Vérif live :3006 → 404/401/préflight CORS 204." }
      - { id: "FE-021", app: "client", title: "Sessions ouvertes — voir et fermer les appareils connectés", epic: "FE-EPIC-002", points: 3, status: "review", backend_ready: "done", backend_ref: "STORY-126", note: "✅ 2026-07-22/24 — LIVRÉE ET MERGÉE dans `dev` (HEAD `cb7d62d` « Fe 021 » ; commits `906debe` carte sessions + `deabeb2` User-Agent BFF). STORY-126 backend LIVRÉE (le blocage de conception ci-dessous est levé). Carte « Sessions ouvertes » sur /mon-profil, 22 unit + 5 E2E. ⚠️ ticket backend restant : l'IP reste celle de l'app (auth-service ignore X-Forwarded-For, STORY-133). — HISTORIQUE : 🆕 2026-07-22 (maquette FE-015 validée). ⚠️ BLOQUÉE PAR UN DÉFAUT DE CONCEPTION, pas par un simple manque : l'IdP stocke un `refreshTokenHash` SCALAIRE sur l'utilisateur ⇒ aucune session à lister, et surtout **une connexion sur un 2ᵉ appareil invalide silencieusement la 1ʳᵉ**. STORY-126 crée la collection de sessions (userAgent/ip/dates) + révocation ciblée." }
      - { id: "FE-022", app: "client", title: "Aperçu des pièces du cabinet + date de validation par pièce", epic: "FE-EPIC-003", points: 3, status: "review", backend_ready: "done", backend_ref: "STORY-127,128", note: "✅✅ 2026-07-23 — IMPLÉMENTÉE, branche `fe-022` POUSSÉE (PR vers dev à ouvrir : compare/dev...fe-022). Carte Documents (/parametres/cabinet) : aperçu par URL présignée (window.open noopener — jamais de <a href> partageable ni de journal), verdict+date PAR PIÈCE (PENDING = « En attente », jamais la date du dossier), historique des versions remplacées à verdict FIGÉ, motif au niveau dossier, « Actualiser » re-signe les liens. Types RÉGÉNÉRÉS depuis :3002 réel ; garde de compilation : reviewStatus requis a cassé 2 fixtures kyc → mises au contrat. PREUVES : 49 unit + 7 E2E verts (2 specs FE-022 dans profile.spec), lint/typecheck/build verts. ⚡ EN CHEMIN : dev de kyc-service ne compilait plus (2 barrels cassés du générateur IDE, commit « mise a jour ») → fix local kyc-service@dev `9209512` NON POUSSÉ. — CONTEXTE : ✅ DÉBLOQUÉE 2026-07-22 — les DEUX backends sont livrés : STORY-127 (url présignée par pièce sur GET /kyc/status, toutes versions y compris SUPERSEDED) et STORY-128 (reviewStatus PENDING|APPROVED|REJECTED + reviewedAt PAR PIÈCE). ⚠️ 2 points à connaître AVANT de coder : (1) une pièce non revue est PENDING SANS reviewedAt — afficher « En attente », ne JAMAIS retomber sur le reviewedAt GLOBAL du dossier (qui reste servi, mais se rapporte au dossier) ; (2) il N'Y A PAS de motif par pièce — le rejectionReason reste au niveau dossier (décision actée en 128), donc le critère 3 « son motif s'il est servi » se lit : motif du dossier. Types à régénérer depuis l'OpenAPI. — CONTEXTE D'ORIGINE : 🆕 2026-07-22. GET /kyc/status ne sert au cabinet NI l'URL de ses propres pièces (l'URL présignée n'existe que sur le DTO admin — Money Vibes peut relire les papiers du cabinet, le cabinet non) NI une date de validation par pièce (seul un reviewedAt global au dossier). F