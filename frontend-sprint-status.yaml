      - { id: "FE-057", app: "client", title: "Dette de contrat Atelier : régénération des types :3007 (mappingProfile→profilImportId) + gate sur `code: EMAIL_NOT_VERIFIED` — amende FE-024/FE-025", epic: "FE-EPIC-007", points: 5, status: "done", backend_ready: "done", backend_ref: "STORY-147,138,088,146", branch: "fe-057", completed_date: "2026-08-08", note: "✅ **MERGÉE dans `dev` le 2026-08-08** — commit `2cc2827`. ⚠️ **ET C'EST UN SHA DIFFÉRENT DE CELUI DE LA BRANCHE** (`beb4ce0`) : « Rebase and merge » REJOUE le commit, il ne le déplace pas. Conséquence vécue sur FE-058, qui était partie de `fe-057` : sa PR portait les DEUX copies du même changement et GitHub annonçait un conflit sur `src/i18n/messages/fr.json`. **Correctif : `git rebase origin/dev` sur la branche dérivée** — git reconnaît le commit déjà appliqué (`skipped previously applied commit`) et le retire tout seul ; puis force-push de la BRANCHE (jamais de `dev`). ⇒ **Règle : une branche empilée sur une autre doit être rebasée sur `dev` APRÈS le merge de sa base, pas avant.** — ⚡⚡ **PREMIÈRE STORY DU SPRINT — elle conditionne FE-056 ET FE-058** (les trois partent de la MÊME régénération de :3007 ; les tirer dans le désordre, c'est régénérer trois fois ou écrire des types à la main). ⚡ AJOUT 2026-08-06 — **STORY-146 est `done` depuis le 2026-08-03** et la régénération va la faire entrer, qu'on le veuille ou non : l'autorité sur le n° de compte passe du validateur (regex) au PLAN DE COMPTES DE L'ORGANISATION (6 chiffres en SYSCOHADA, normalisation des comptes Sage 8 chiffres/auxiliaires). Le tracker avait prévu « un passage de vérification, pas une story » : **ce passage est ICI**, en AC de FE-057 — vérifier que les comptes affichés par FE-025/026/027 gardent leur forme après agrégation des auxiliaires, et que la saisie ne re-bride pas côté client une règle qui vit désormais dans le référentiel. ⚠️ NE PAS y ajouter de regex de compte dans l'UI : ce serait recréer côté front l'autorité que le backend vient 