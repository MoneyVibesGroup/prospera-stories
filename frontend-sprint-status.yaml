      - { id: "FE-040", app: "client", title: "Profil société : CRUD (NIF, RCCM, CNSS, actionnaires, forme juridique, gérant) — FR-A01", epic: "FE-EPIC-007", points: 5, status: "blocked", backend_ready: "done", backend_ref: "STORY-079,356", note: "⛔ **NOTE CORRIGÉE LE 2026-08-19 PAR FE-063 — L'ORDRE ÉNONCÉ ICI REPOSAIT SUR UNE MIGRATION QUI N'A PAS EU LIEU ET N'EST PAS PLANIFIÉE.** Cette note disait « doit passer APRÈS FE-063, qui migre `profil-societe` vers `dossier-service` ». **STORY-236 place ce module explicitement HORS PÉRIMÈTRE** (« semble déjà superflu », dépréciation = « sujet séparé, à trancher avec le PO ») ; vérifié dans le code au 2026-08-19 : `dossier-service` n'a que `dossiers` + `exercices`, et `balance-service` sert toujours `/profil-societe` **org-keyed**. ⇒ **FE-063 NE DÉBLOQUE PAS CETTE STORY**, et la lancer telle quelle câblerait une identité de société sur une ORGANISATION — précisément « une org = une société » que tout ce bloc démonte. ⚠️ **ARBITRAGE PO REQUIS AVANT DEV** *(le même pour FE-041 et FE-042)* : soit `dossier-service` porte l'identité fiscale (il porte DÉJÀ pays, type d'entité et les 2 axes via STORY-301/302/304 — le profil de `balance-service` ferait alors doublon), soit une story backend de migration est créée. Tant que ce n'est pas tranché, ces trois stories restent `blocked` sur une DÉCISION, pas sur du code. — Contexte d'origine — ✅ Backend `done` depuis le 2026-07-27 (`/api/v1/profil-societe`). ⏳ **MAIS ELLE DOIT PASSER APRÈS FE-063**, qui migre `profil-societe` vers `dossier-service` : l'écrire avant reviendrait à câbler l'identité d'une société sur une ORGANISATION — exactement l'invariante que ce bloc démonte. C'est la seule raison de son `blocked`, et elle tombe le jour où FE-063 est mergée, dans ce même sprint." }
      - { id: "FE-041", app: "client", title: "OCR Statuts + carte CFE → profil pré-rempli éditable — FR-A02", epic: "FE-EPIC-007", points: 3, status: "blocked", backend_ready: "done", backend_ref: "STORY-081,356", note: "⚡ **RÉANCRÉE LE 2026-08-19 PAR FE-060 — SON BACKEND EST `done` DEPUIS LE 2026-07-27, ET FE-060 EN CONSOMME DÉSORMAIS LA SURFACE.** `POST /profil-societe/ocr` + `GET /profil-societe/ocr/:extractionId` (`balance-service`) sont servis et **appelés** : dépôt des 2 pièces, extraction, pré-remplissage étiqueté. ⇒ **ce qui reste à cette story n'est PLUS « brancher l'OCR »**, mais la restitution de l'extraction **hors** de l'assistant de création. **À réévaluer, pas à attendre.** — Contexte d'origine — ⛔ **MÊME CORRECTION QUE FE-040 (2026-08-19, par FE-063)** : l'ordre « après FE-063 » supposait la migration de `profil-societe` vers `dossier-service`, que **STORY-236 exclut explicitement**. Arbitrage PO requis avant dev — voir la note de FE-040. — Contexte d'origine — ✅ Backend `done` des DEUX côtés (2026-07-27) : `document-service` produit `document.profil.extrait` (upload + BullMQ + extraction par champ) et `balance-service` le consomme. ⏳ Même contrainte d'ORDRE que FE-040 : après FE-063. ⚠️ Le pré-remplissage doit rester ÉDITABLE champ par champ et afficher ce qui a été LU vs SAISI — un OCR silencieusement autoritaire est pire qu'un formulaire vide." }
