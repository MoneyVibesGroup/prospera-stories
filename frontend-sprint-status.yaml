version: "5.8.0"   # ⬆️ 2026-08-19 (2ᵉ passe du jour) — **FE-060 LIVRÉE : LE FRONT ÉCRIT ENFIN DANS `dossier-service`.** Le service exposait **7 routes d'écriture** et le front n'en consommait **AUCUNE** — une organisation n'avait qu'un seul dossier (« Mon cabinet », posé par rejeu d'événement, D1) et **un cabinet ne pouvait pas ajouter un client**. FE-060 en consomme **3** ; **4 restent** (`archiver`/`reactiver` → FE-061, `exercices/clore`/`rouvrir` → FE-066), toutes `ready-for-dev` avec leur backend `done`. ① ⛔ **UNE MAQUETTE VALIDÉE PAR LE PO N'EST PAS UN CONTRAT : 9 ÉCARTS** entre `FE-D01` et ce que `:3009` sert réellement — SNC/SCI et « Distributeur » absents des `enum`, 7 des 8 pays non servis, `parts`/`pourcentage`/`type` requis là où la maquette montrait une colonne, `DirigeantDto` sans nationalité ni n° de pièce. ⇒ **RÈGLE : valider une maquette, c'est la confronter à l'OpenAPI VIVANT avant d'en coder une ligne — pas la lire.** ② ⛔ **UNE ÉTAPE ENTIÈRE DE LA MAQUETTE N'ÉTAIT PAS ENVOYABLE** : les 2 axes (SN/SMT, réel/TPU) ne figurent pas dans `CreerDossierDto`, **prouvé en live** (`400 « property systemeComptable should not exist »`). Les proposer aurait produit un formulaire dont la moitié des réponses est **jetée en silence** — la panne plausible, pas la panne bruyante. ⇒ FE-065, et **AC-6 de FE-060 devient SANS OBJET**. ③ ⛔ **UN AC PEUT NOMMER UN CODE D'ERREUR QUI N'EXISTE PAS** : l'AC-3 écrivait `NIF_DEJA_UTILISE`, le serveur émet `DOSSIER_NIF_DEJA_UTILISE`. Un écran branché sur la fiche n'aurait **jamais** reconnu le conflit et serait retombé sur le message générique — **exactement le défaut que l'AC interdit, avec l'AC comme cause**. Même famille que le commentaire d'écart périmé de FE-017. ⇒ **RÈGLE : un code d'erreur se lit dans le `throw` du service, jamais dans la fiche ; et le test doit vérifier que le nom de la fiche N'EST PAS reconnu.** ④ ⛔ **`GET /dossiers/:id/completude` N'EXISTE PAS** alors que deux fiches la nomment (FE-060 en tête, **FE-061 dans son contenu**) — note posée sur FE-061, **à réancrer avant de la tirer**. ⑤ ⚡ **« TOUT CE QUI SUIT `/dossiers/` EST UN IDENTIFIANT » EST FAUX DANS TROIS COUCHES** : le contrôleur backend le documente déjà pour son propre routage ; la résolution de scope du front y tombait (`/dossiers/nouveau` → `GET /dossiers/nouveau`, 404 garanti, + sélecteur de dossier actif sur l'écran où l'on n'en a pas encore) ; et **un locator de test y tombait aussi** — `a[href^='/dossiers/']` comptait 4 dossiers là où le serveur en sert 3, **faussant l'assertion de PORTÉE de FE-059a**, la plus importante de cet écran. ⇒ `SEGMENTS_RESERVES` ; **toute page littérale ajoutée sous `/dossiers` doit y être inscrite.** ⑥ ⚠️ **UNE STORY PEUT DÉCLARER RÉUTILISER DES STORIES QUI N'EXISTENT PAS** : FE-060 disait réutiliser FE-040/041/042 — les trois sont `blocked`, et FE-063 avait déjà établi la veille que l'ordre qui les précédait « ne reposait sur rien ». **Il n'y avait rien à réutiliser.** La DoD « amender leurs notes » est laissée **décochée** : cocher aurait affirmé un travail qui n'existe pas. ⑦ ⚠️ **UNE CRÉATION PEUT NE PAS ÊTRE UNE TRANSACTION** : responsable et exercice ne sont pas dans le corps de création, ce sont 2 requêtes de plus. Un échec de suite laisse un dossier **RÉEL** — l'écran le nomme et **interdit de recréer** (le contrôle d'unicité du NIF ne rattrape pas un doublon quand il n'y a pas de NIF). 🏁 **INTEGRATION GATE FAIT EN VRAI NAVIGATEUR** (aucun stub, login réel via le BFF, :3100 → :3009) : création `201`, **doublon de NIF PROVOQUÉ** comme l'exigeait la DoD → `409` portant `details.dossierId`/`details.raisonSociale`, renvoi suivi ; `PATCH …/affectation` `200` ; `POST …/exercices` bornes irrégulières `201`, `dureeEnJours: 292` **= le calcul client** ; **0 erreur CORS**. ✅ Gates : typecheck · lint 0 warning · build · **659 unitaires** (57 neufs) · **8 E2E** neufs · suite **111/114** — ⚠️ **les 3 rouges PRÉEXISTENT sur `origin/dev`** (vérifié par checkout : `atelier-scope-dossier:252`/`:304`, l'Integration Gate de FE-063 — **à traiter, ils ne sont pas un flake**). **AC-7 et AC-8 prouvés PAR MUTATION.** — Historique — ⬆️ 2026-08-19 (1ʳᵉ passe) — **FE-063 LIVRÉE, ET ELLE A TROUVÉ DEUX ÉCARTS DE PÉRIMÈTRE QUI DÉBORDENT SUR TROIS AUTRES STORIES.** ① Réancrage `origin/dev` des deux dépôts : FE-INT-5, FE-059a et **FE-062 sont MERGÉES** (`886968e`, `a2b19e4`, `2fcf123`) — les trois notes disaient encore « PR à ouvrir ». ② **L'Integration Gate que FE-062 avait laissé OUVERT est honoré** : la bascule A→B est prouvée PAR LES CHIFFRES, ce qui était structurellement impossible avant que les appels portent le `dossierId`. ③ ⛔ **LE PÉRIMÈTRE DE FE-063 ÉTAIT FAUX DE 10 FAMILLES SUR 15, DANS LE SENS QUI RASSURE** : le backend sert `cahiers/*`, `fiscal/*`, `rapprochement`, `pieces`, `rattachement`, `imports`, mais **aucun écran ne les appelle** (ce sont FE-043→050, sprint 12). Le front n'avait que 5 familles à re-scoper. ⇒ **RÈGLE : le périmètre d'une story de migration front se compte sur les APPELS DU FRONT, jamais sur les routes du backend** — les deux inventaires portent le même nom et ne mesurent pas la même chose. ④ ⛔ **`profil-societe` N'A PAS MIGRÉ ET N'EST PAS PLANIFIÉ** : STORY-236 le place explicitement hors périmètre (« sujet séparé, à trancher avec le PO »). L'AC-6 de FE-063 est sans objet, **et l'ordre « FE-040/041/042 après FE-063 » ne reposait sur rien** — trois stories qu'on aurait ouvertes en croyant leur amont prêt. ⇒ **RÈGLE : quand une story A justifie l'ordre d'une story B par un travail précis, vérifier que ce travail est dans le PÉRIMÈTRE LIVRÉ de A, pas seulement dans son titre.** ⑤ Le sprint 11 est devenu **mixte** (1 livrée · 2 actionnables · 6 bloquées backend · 3 bloquées sur une DÉCISION) : constat posé dans son `backend_dependency`, **arbitrage PO dû** — 3 décisions listées. — Historique — ⬆️ 2026-08-17 (2ᵉ passe du jour) — **RÉANCRAGE SUR `origin/dev` : LE TRACKER RETARDAIT DE HUIT JOURS ET IGNORAIT 11 PTS DÉJÀ LIVRÉS.** Déclencheur PO : « AP-26 est encore `ready-for-dev` alors qu’AP-06/07/09/12/20/22 sont mergées ». Le `git log origin/dev` des DEUX dépôts frontend a trouvé plus que ça. ① **AP-26 EST LIVRÉE ET MERGÉE CE JOUR** (`842ab35` + `b359dc6` + `c4872f1`, plus `9757dbd` côté BFF `admin-panel`) — elle était `ready-for-dev`. ② ⛔ **AP-08 (8 pts) ET AP-10 (3 pts) SONT MERGÉES DEPUIS LE 2026-08-09 ET N’EXISTAIENT DANS AUCUN SPRINT DE CE FICHIER.** Leurs fiches existent (`frontend-stories/AP-08.md` et `AP-10.md`, toutes deux `Status: review`), les épics AP-EPIC-000 et AP-EPIC-002 les nomment — seules les listes `stories:` des sprints les avaient perdues. **11 pts de travail livré, invisibles au plan.** C’est une forme NOUVELLE du défaut de chaînage que ce fichier documente cinq fois : non plus « une story backend livrée que rien ne nomme », mais **une story FRONTEND livrée que le tracker ne compte pas**. ⚠️ Le symptôme était visible depuis le 2026-07-31 et n’a jamais été lu : le S6 s’intitule « admin-panel v1 🏁 : provisioning + dashboard + **RBAC plateforme** » et ne contenait **aucune story admin** — le nom du sprint décrivait AP-08, absente. ③ Le S8 est **intégralement mergé** (5/5 dans `dev`) et restait `in-progress` ; le S9 est **en cours** (9 de ses 16 stories mergées) et restait `not_started` ; `current_sprint` disait 8. ⇒ **RÈGLE AJOUTÉE : le réancrage `git log origin/dev` des deux dépôts est un PRÉREQUIS D’OUVERTURE DE STORY, pas une hygiène périodique.** Le programme a déjà payé ce délai le 2026-08-06 (6 jours sans `git log` ⇒ 2 sprints faux, 23 pts mergés comptés à faire) ; ici c’est 8 jours ⇒ 11 pts hors plan et une story prête à être redéveloppée. ⇒ **ET UN COROLLAIRE : constater un compteur faux ne le réancre pas.** La v5.5.1 écrivait noir sur blanc que `current_sprint` retardait « pour la 5ᵉ fois » et le laissait à 8. Un écart noté mais non corrigé se relit comme un écart connu, donc toléré. — Historique v5.5.1 (2026-08-17) — ⬆️ 2026-08-17 — **+FE-INT-5 (2 pts, S10 en tête) : LA PLOMBERIE QUI MANQUAIT AU BLOC DOSSIER.** Le front n'a ni base, ni préfixe logique, ni types pour `dossier-service` — `grep -r dossier` rend ZÉRO occurrence dans `services.ts`, `env.ts` et `gen-api.mjs`, alors que les 34 pts du S10 en dépendent tous. **5ᵉ occurrence du défaut de chaînage, dans une forme nouvelle** : 8 stories backend livrées, 12 routes montées, service DÉCLARÉ dans le compose racine avec CORS et port publié — et le front l'ignore. ⇒ règle ajoutée : à l'ouverture d'un bloc s'appuyant sur un service NEUF, `grep` son nom dans le compose ET dans `services.ts` ET dans `gen-api.mjs`. ✅ INFRA VÉRIFIÉE EN NAVIGATEUR ce jour (401 vs 404, préflight `Origin: :3100` avec en-tête, origine non autorisée sans en-tête, `/api/docs-json` 200, 10 dossiers « Mon cabinet » déjà semés) — le piège CORS de FE-057 est désamorcé AVANT le premier écran, une première. ⛔ **ET UN CONSTAT QUI CHANGE LE S11 : STORY-236 (done le 16/08) A RENDU 5 DES 7 APPELS DE L'ATELIER MORTS** (`dossiers/:dossierId/…` partout côté `balance-service`) et **rien ne le signale** — le front dérive ses types de `components["schemas"]` exclusivement, jamais de `paths[…]`, donc gen:api/tsc/lint/build restent VERTS sur 5 appels 404. ⇒ FE-063 n'est plus « en avance sur le plan », c'est une RÉPARATION, et son amont (236+356) est `done`. — Historique v5.5.0 (2026-08-14) — **MODULE 1 EST RÉORGANISÉ AUTOUR DU DOSSIER, ET SA DÉFINITION EST ÉLARGIE PAR LE PO.** Déclencheur : `dossier-service` existe depuis le 13/08 et **STORY-355 « l'exercice appartient au dossier » est mergée le 14/08** — 6 des 13 stories de l'EPIC-043 sont `done`. Le plan menait encore droit aux modules. ⇒ ① le socle dossier (ex-S19.1/19.2/19.3) REMONTE de neuf sprints en S10/S11 ; ② le Bilan passe APRÈS lui et **naît dossier-scopé**, ce qui SUPPRIME FE-067 (« re-scopage du Bilan », 5 pts) ; ③ FE-029 est SUPPRIMÉE (elle écrivait un CRUD d'exercices sur `POST /bilan/exercices`, périmé par 355) et remplacée par FE-066 ; ④ FE-039 est FUSIONNÉE dans FE-069 (deux e2e qui se recouvraient sur tout leur milieu) ; ⑤ l'Atelier EXTENDED (67 pts) passe après FE-063 et ne sera donc JAMAIS re-scopé ; ⑥ 3 tickets FRONTEND ouverts et jamais inscrits deviennent AP-26/27/28, dont **AP-26 qui répare une régression MUST : la console rend `428` sur TOUTE décision KYC depuis STORY-182 (07/08)** ; ⑦ AP-24, ORPHELINE depuis le 08/08, et AP-INT-2, endormie au S19 avec ses 6 déclencheurs livrés, sont slottées au S9. ⚡ **ARBITRAGE PO DU 14/08, ÉLARGI DEUX FOIS** : « l'Atelier EXTENDED on doit le faire avant de dire que le module est terminé, et même la dette console est liée à l'intégration du module 1 » ⇒ MODULE 1 = socle dossier (34) + Bilan (45) + fermeture & preuve (18) + Atelier EXTENDED (67) + dette console (23) + dette de contrat client (4) = **189 pts à tirer, dont 176 jusqu'au S13 inclus** (la porte) et 13 au S14, sa queue bloquée par un backend non démarré. ⚠️ `Module 1` désigne le SEUL Bilan dans ce dépôt (l'Atelier est `Module 1-bis`) : le périmètre retenu ici est celui du PO, plus large que l'étiquette — l'ancienne ligne de jalon « S10-S13 🏁 Module 1 Bilan côté UI » était un jalon PARTIEL présenté comme final. ⚡ CAPACITÉ PORTÉE À ~40 pts/sprint (décision PO du 14/08) : c'est une décision de MOYENS, pas une extrapolation du réel observé (S8 = 24 codés, S9 = 24 mergés). Si elle n'est pas tenue, c'est le S13 qui glisse, pas le périmètre. ⚠️ AUCUN SPRINT RENUMÉROTÉ : S15→S19 sont volontairement VACANTS, le bloc distributeur/PI-SPI garde S20→S28. — Historique v5.4.0 (2026-08-09) : **LE DOSSIER CLIENT DEVIENT L'UNITÉ DE TRAVAIL DU CABINET** : +1 epic (FE-EPIC-008), +11 stories (FE-059→069, 57 pts), +3 sprints (19.1 → 19.3), tous `blocked` sur un amont unique — le sprint 20 BACKEND / EPIC-043. Volet frontend du ticket `TICKET-BACKEND-dossier-client-entite-de-premier-rang.md`.
