last_updated: "2026-08-07"  # 🆕 v5.3.0 — **TOUT LE PLAN RÉORGANISÉ SUR UN SEUL CRITÈRE** (demande PO : « ce qui est déjà débloqué doit être fait vite, ce qui ne l'est pas va dans des sprints futurs »). ⚡ RÈGLE POSÉE, et c'est elle qui explique tous les mouvements : **un sprint est SOIT intégralement actionnable, SOIT intégralement en attente — jamais les deux.** Motif : une story bloquée logée dans un sprint actionnable ne se contente pas d'être en retard, elle FAUSSE LE SPRINT — elle occupe la capacité au tableau, fait paraître plein ce qui ne l'est pas, et produit à la revue un « sprint non terminé » pour une cause que personne ne contrôlait. 📊 RÉSULTAT MESURÉ : **S8→S17 = 149 pts, ZÉRO dépendance ouverte** (dix sprints à ~15 pts exécutables dans l'ordre, dès aujourd'hui) · **S18+S19 = 19 pts d'AMONT UNIQUE, le sprint 20 BACKEND** · **S20→S27 = 126 pts, amont sprints backend 30→33** · S28 différé. Avant cette révision, 8 pts bloqués étaient dispersés dans les trois sprints les plus proches (AP-INT-2 au S8 puis S9, AP-19 et AP-21 au S10) — tous suspendus au MÊME sprint backend, et aucun des trois ne le disait au même endroit. 🔄 QUATRE MOUVEMENTS : (1) **S19 « paiement cabinet » DISSOUS** — ses 3 stories ne partageaient qu'un THÈME, leurs AMONTS étaient à trois endroits : FE-011 (backend `done`) remonte au **S9** et devient faisable dix sprints plus tôt · FE-012 va au **S23**, dont STORY-153/154 est déjà l'amont exact · FE-013 va au **S27**, dont STORY-161/163 est déjà l'amont exact. ⇒ l'arbitrage d'ordre ouvert le 08-03 est RENDU, et mieux qu'en décalant un sprint de huit rangs : **cabinet et distributeur développent désormais le même contrat dans le même sprint**, ce que la réserve de FE-013 réclamait sans pouvoir l'obtenir. (2) **S19 recomposé** en sprint de dette console (AP-INT-2 + AP-19 + AP-21), amont unique = sprint 20 backend, en binôme avec le S18 (conseil fiscal) qui attend le même. (3) **S10 devient intégralement actionnable** (22→17 pts, zéro bloqué). (4) ⚠️ **DI-11 requalifiée `ready-for-dev` → `blocked`** : son backend est livré (`backend_ready: done` reste VRAI) mais elle attend DI-01 — **seul blocage purement FRONTEND du plan**, il gonflait l'actionnable de 5 pts en se disant prêt. ⚠️ AUCUN NUMÉRO DE SPRINT N'A ÉTÉ DÉCALÉ : ce fichier écrit « S20 » pour désigner tantôt un sprint frontend tantôt un sprint backend, et renuméroter un bloc aurait rendu faux chaque commentaire historique qui le cite. ⚡ ET LE NUMÉRO DE SPRINT DIT L'ORDRE, PAS UNE DATE : une story du S19 se tire le jour où son backend tombe, même si l'on en est au S12. Regrouper le bloqué ne le repousse pas — ça le rend tirable en un seul endroit au lieu de le disséminer. — HISTORIQUE v5.2.0 (2026-08-06) : RÉORGANISATION DES SPRINTS 8 ET 9 CONTRE LE CODE (demande PO : « analyse ce qui est fait backend, intègre ce qui est faisable, repousse ce qui ne l'est pas »). Vérification faite sur les `origin/dev` des 2 dépôts frontend ET des 8 services, plus `sprint-status.yaml`. ⚡ CONSTAT CENTRAL : **le tracker sous-estimait le travail fait DES DEUX CÔTÉS.** Côté frontend, 23 pts donnés `ready-for-dev` sont en réalité MERGÉS dans `dev` — AP-INT-0 (8, `f1c2258`), AP-06 (5, `e458750`) et AP-07 (5, `c9faa79`), plus AP-INT-1 (5) déjà à jour. Côté backend, DIX stories livrées entre le 08-03 et le 08-06 n'étaient réancrées nulle part. ⇒ **S8 : 24 pts dont 13 faits, 11 à faire** (FE-057 → FE-056 → FE-058, ordre imposé par la régénération de :3007) ; **S9 : 29 pts dont 10 faits, 16 à faire, 3 conditionnels**. 🆕 **FE-058 CRÉÉE** (valider/rejeter une balance) : STORY-145 est `done` depuis le 08-03 et la note de FE-027 COMMANDAIT explicitement cette story — personne ne l'avait ouverte, elle n'existait que dans la note d'une story `done`. C'est la 3ᵉ occurrence en une semaine du même défaut de chaînage (avec AP-12/STORY-149 et AP-21/STORY-175) : **une story backend livrée ne déclenche rien tant qu'une story frontend ne la nomme pas.** 🔓 QUATRE DÉBLOCAGES RÉELS : FE-017 (l