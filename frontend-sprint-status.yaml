    status: "in-progress"  # 🔄 2026-07-31 : le VOLET CLIENT est intégralement livré (FE-015/016/018/021/022/023 en `review`, toutes mergées dans `dev` sauf rien) ; il ne reste QUE le volet admin (AP-02, AP-03), lui-même derrière AP-01. La démo de boucle du sprint reste donc INDÉMONTRABLE — pas faute de backend, faute de console.
