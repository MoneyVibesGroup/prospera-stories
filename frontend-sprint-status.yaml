  # ══════════════════════════════════════════════════════════════════════════════════════════════
  # SPRINTS 20→28 — AJOUTÉS le 2026-08-03 (sprint-planning distributeur × PI-SPI).
  # 26 stories frontend (AP-13→18, DI-01→11, DI-INT-0, PY-00→03, MB-01→04) avaient un FICHIER et
  # AUCUN SPRINT depuis le 2026-08-02 : invisibles du planning et de tout comptage. Slottées ici.
  #
  # ⚡ ORDRE = décision PO du 2026-08-02 (PLAN-DISTRIBUTEUR-PI-SPI §5-bis) : socle, puis PI-SPI de
  # la CONSOLE, puis PI-SPI du distributeur, puis la page publique. Les deux derniers blocs sont
  # créés `blocked` avec leur bloqueur NOMMÉ — bloqué et visible vaut mieux qu'oublié.
  #
  # ⚠️ TOUT ce bloc dépend de backend `not_started` (sprints backend 30→33). C'est la première fois
  # depuis le S8 que le frontend n'a PAS de travail immédiatement actionnable devant lui : à la fin
  # du S19, le frontend attend le backend. À dire au sprint-planning, pas à découvrir.
  #
  # ⚡ AJOUT 2026-08-07 — **LE SPRINT 19 « PAIEMENT CABINET » EST DISSOUS, SES STORIES REJOIGNENT CE
  #   BLOC PAR L'AMONT QU'ELLES PARTAGENT.** L'arbitrage d'ordre ouvert le 2026-08-03 est rendu :
  #   « ce sprint frontend porte le n° 19 mais dépend du backend S31/S33, alors que les sprints
  #   20→27 dépendent du backend S30 — il devrait passer APRÈS eux ». La réponse n'est PAS de
  #   décaler un sprint entier de huit rangs : c'est de constater que ses trois stories n'avaient
  #   rien à faire ensemble. Elles ne partageaient qu'un THÈME (le paiement du cabinet) ; leurs
  #   AMONTS étaient à trois endroits différents.
  #     • FE-011 (catalogue de plans, backend `done`)      → remontée au **S9**, faisable aujourd'hui
  #     • FE-012 (checkout, STORY-153/154, backend S31)    → **S23**, dont c'est déjà l'amont exact
  #     • FE-013 (abonnement, STORY-161/163, backend S33)  → **S27**, dont c'est déjà l'amont exact
  #   ⇒ Deux effets qu'un décalage de sprint n'aurait pas produits : 2 pts d'actionnable récupérés
  #   dix sprints plus tôt, et surtout **cabinet et distributeur développés sur le MÊME contrat au
  #   MÊME moment** (S23 : checkout cabinet + demande de paiement distributeur ; S27 : abonnement
  #   vu par le cabinet + abonnements vus par Money Vibes). La réserve écrite dans FE-013
  #   — « recouvrement à vérifier avec AP-15/AP-16, qui servent les MÊMES stories backend » — était
  #   invérifiable tant que les stories vivaient dans deux sprints ; elle devient un simple point
  #   de vigilance de sprint.
  #   ⚠️ AUCUN NUMÉRO DE SPRINT N'A ÉTÉ DÉCALÉ. C'était l'autre option, et elle a été écartée : ce
  #   fichier emploie « S20 » pour désigner tantôt un sprint frontend tantôt un sprint backend, et
  #   renuméroter d'un rang un bloc entier aurait rendu faux chaque commentaire historique qui le
  #   cite. Le tracker a déjà payé deux fois des références devenues fausses ; pas une troisième.
  #
  # ⚡ RÈGLE DE REPORT (plan §5) : une story DI- n'est ouverte que lorsque le service qui porte ses
  # données est livré — JAMAIS sur une fixture. Le programme a déjà payé de ne pas la tenir
  # (FE-008/009/010 livrées en miroir de contrats supposés ; FE-023 découvrant au gate qu'une URL
  # présignée était invisible du navigateur). Le distributeur part de plus loin : il n'a pas un
  # contrat supposé, il n'a pas de contrat du tout.
