      - { id: "FE-019", app: "client", title: "Mon profil : le membre corrige son identité + son téléphone, change son mot de passe et son e-mail (PATCH /users/me · POST /users/me/password · POST /users/me/email)", epic: "FE-EPIC-002", points: 3, status: "review", backend_ready: "done", backend_ref: "STORY-123,124", note: "🔓 backend_ready S16→done (2026-07-26) : STORY-123 ET 124 LIVRÉES (done). ✅ 2026-07-23 — IMPLÉMENTÉE, branche `fe-019` POUSSÉE (PR : compare/dev...fe-019). 3 blocs (identité PATCH partiel · mot de passe avec révocation assumée → /login · e-mail 202 non affirmatif + pendingEmail annulable) ; AUCUN RBAC (prouvé par test) ; politique mdp alignée RegisterDto. PREUVES : 44 unit isolés · 106/106 complet · 28/28 E2E · lint/typecheck/build verts. — 🆕 2026-07-22 — GAP remonté PAR FE-015 puis VÉRIFIÉ dans les contrôleurs de l'IdP : `GET /users/me` existe, mais AUCUNE route ne permet à un membre d'agir sur son propre compte (`PATCH /users/:id` est @Roles(TENANT_ADMIN) et ne touche QUE role+status) et AUCUN rôle ne peut changer un mot de passe. La maquette « Mon profil » est donc EN LECTURE SEULE avec la mention « demande à formuler côté auth-service » → ⚡ LA DEMANDE EST FORMULÉE : **STORY-123** (identité + téléphone + mot de passe + identity.user.updated, 5 pts) et **STORY-124** (e-mail VÉRIFIÉ, 3 pts), backend **S14**. ⛔ BLOQUÉE tant que 115 n'est pas livrée — il n'y a littéralement rien à appeler. DÉCOUPLAGE si 116 glisse : livrer Identité + Mot de passe, masquer le bloc E-mail (la story reste démontrable). ⚠️ 2 comportements backend à rendre CORRECTEMENT dans l'UI, sous peine de ressembler à des bugs : (a) un changement de mot de passe RÉVOQUE le refresh token ⇒ message explicite + redirection /login, jamais un 401 subi ; (b) la demande de changement d'e-mail répond **202 même si l'adresse est déjà prise** (anti-énumération) ⇒ formuler « si cette adresse est disponible, un lien y a été envoyé », et dire que l'ANCIENNE adresse reste l'identifiant de connexion jusqu'à confirmation. ⚡ AUCUN RBAC : tout membre édite SON profil (différence de fond avec FE-015, réservé au TENANT_ADMIN). Ne touche NI le profil du cabinet NI le retrofit du shell (FE-015)." }
      - { id: "FE-020", app: "client", title: "Mot de passe oublié — récupération de compte (POST /auth/forgot-password · POST /auth/reset-password)", epic: "FE-EPIC-001", points: 2, status: "review", backend_ready: "done", backend_ref: "STORY-125", note: "🔓 backend_ready S16→done (2026-07-26) : STORY-125 LIVRÉE (done). ✅ 2026-07-23 — IMPLÉMENTÉE, branche `fe-020` POUSSÉE (PR : compare/dev...fe-020). 2 écrans PUBLICS (groupe (auth), hors garde AppShell — AC 9 prouvé) + lien depuis le login. Anti-énumération : écran de succès non affirmatif et identique quel que soit le sort de l'adresse ; token absent → erreur sans appel réseau ; 400 → sortie « refaire une demande » ; politique mdp alignée RegisterDto. ⚡ ROUND-TRIP LIVE MAILHOG PROUVÉ : forgot 202 → lien lu (pointe sur :3100) → reset 204 → login nouveau 200 → ancien 401 → token rejoué 400. Config STORY-125 (PASSWORD_RESET_URL_TENANT/_PLATFORM) injectée au compose racine (faite en FE-019). PREUVES : 59 unit auth · 35/35 E2E (7 FE-020) · lint/typecheck/build verts. — 🆕 2026-07-22 — DEMANDE EXPLICITE DU PO. Aujourd'hui un mot de passe oublié = un COMPTE PERDU : l'IdP n'a ni forgot-password ni reset-password, et aucune réinitialisation assistée (vérifié dans le code). Backend = STORY-125 (S14), ⛔ bloquante. 2 écrans publics (/mot-de-passe-oublie, /reinitialiser-mot-de-passe?token=) + lien « Mot de passe oublié ? » sur /login (FE-005 ne l'a pas — il n'y avait rien derrière). ⚠️ 2 comportements à rendre CORRECTEMENT : (a) le backend répond **202 même pour une adresse inconnue** (anti-énumération) ⇒ message NON AFFIRMATIF obligatoire « si un compte existe pour cette adresse, un lien vient d'y être envoyé », jamais « e-mail envoyé à … » ni « aucun compte trouvé », et aucun signal par le comportement (même délai perçu, pas de champ rouge) ; (b) token invalide/expiré/déjà utilisé → 400 avec un chemin de SORTIE (refaire une demande), jamais une erreur sans issue. ⚡ PIÈGE N°1 : les 2 écrans sont PUBLICS — la garde de routes de FE-005 ne doit PAS les rediriger vers /login, sinon la récupération devient inatteignable précisément quand on en a besoin (test dédié). ⛔ Le front ne déclare JAMAIS son URL de retour : la cible est une config SERVEUR (PASSWORD_RESET_URL_TENANT) et tout champ de redirection dans le corps est rejeté en 400 (garde anti-redirection ouverte). Preuve attendue : parcours navigateur complet avec le lien LU DANS MAILHOG. Story sœur : AP-09." }
      - { id: "AP-09", app: "admin", title: "Mot de passe oublié — récupération de compte pour les opérateurs plateforme (console admin)", epic: "AP-EPIC-000", points: 2, status: "ready-for-dev", backend_ready: "done", backend_ref: "STORY-125", note: "🔓 DÉBLOQUÉE 2026-07-26 — STORY-125 est LIVRÉE (done, S16 backend, mergée sur dev, vérifiée docker sur les 2 personas dont PLATFORM_ADMIN : le lien plateforme pointe sur :3110 via PASSWORD_RESET_URL_PLATFORM). Le blocage backend est LEVÉ. ⚠️ Dépendance RÉSIDUELLE : AP-01 (socle admin-panel : BFF + login PLATFORM_ADMIN) — le dépôt admin-panel ne contient à ce jour que le BFF (MNV-046→107), aucune UI. AP-09 n'a besoin QUE des 2 Route Handlers publics du BFF (pass-through), pas du shell authentifié, mais il faut le projet AP-01 en place pour les héberger. ⇒ livrable dès qu'AP-01 est fait. — HISTORIQUE : 🆕 2026-07-22 — DEMANDE EXPLICITE DU PO (« mais aussi au niveau de l'admin-panel »). ⚠️ C'EST ICI QUE LE TROU EST LE PLUS GRAVE : les comptes plateforme sont SEEDÉS (seed-platform-admin.ts) ou créés par invitation org-less (STORY-104), et platform-users.controller.ts n'expose que POST/GET/PATCH-rôle ⇒ AUCUN PLATFORM_ADMIN ne peut débloquer un PLATFORM_KYC_OFFICER qui a oublié son mot de passe → seule issue actuelle = rejouer un seed À LA MAIN EN PRODUCTION. Impasse d'exploitation. STORY-125 traite les 2 publics avec LE MÊME CODE ⇒ AP-09 est délibérément MINCE : 2 pages + 2 Route Handlers de pass-through dans le BFF (le panel est un BFF SANS BASE, il ne possède aucune identité). ⚡ AC DISTINCTIF vs FE-020 : le lien reçu par e-mail doit ramener SUR LA CONSOLE, pas sur l'app cabinet — le backend déduit la cible du compte (platformRole → PASSWORD_RESET_URL_PLATFORM) ; à prouver en bout-en-bout, lien lu dans Mailhog, sur un VRAI compte plateforme. ⚡ PIÈGE N°1 : les 2 écrans ET les 2 routes du BFF sont PUBLICS — ne pas les placer derrière la garde PLATFORM_ADMIN d'AP-01 ni les proxifier avec un jeton (elles sont appelées PAR DÉFINITION par quelqu'un qui n'est pas connecté) ; test dédié. Anti-énumération d'autant plus sensible ici que l'annuaire visé est celui des employés Money Vibes. Le BFF ne journalise NI le corps NI le token (le token vaut le compte)." }

