      - { id: "AP-08", app: "admin", title: "RBAC plateforme : membres (invitation org-less + attribution de rôle) + composition de rôles depuis le catalogue de permissions + masquage d'UI sur perms[] (amende AP-01)", epic: "AP-EPIC-000", points: 8, status: "ready-for-dev", backend_ready: "done", backend_ref: "STORY-103,104,105,106", note: "🔓 DÉBLOQUÉE 2026-07-28 — STORY-106 est LIVRÉE. La story pariait sur sa sortie et le pari a été tenu LE JOUR MÊME (2026-07-17, 🏁 EPIC-025 clos) ; le statut n'a jamais été réancré et elle est restée `blocked` sur une phrase pendant onze jours. Vérification faite — celle que la story prescrivait elle-même : origin/dev de prospera-admin-panel-service est à 0521258 (plus 52c6f23), `grep -r RequirePermissions src/` RENVOIE DES RÉSULTATS (il était vide), les 6 routes déclarées manquantes EXISTENT (GET /admin/permissions ; GET|POST /admin/roles ; PATCH|DELETE /admin/roles/:name ; PATCH /admin/users/:id) et le gating est en place (@RequirePermissions ROLE_MANAGE + USER_INVITE). ⚡ C'EST CETTE STORY QUI PORTE LES RÔLES INTERNES Comptable/Marketing/DG demandés le 2026-07-28 — aucune story frontend n'a été créée pour eux, la mécanique est ici. Son AC nº3 passera de 8 à 12 permissions après STORY-140. — HISTORIQUE : 🆕 2026-07-17 — GAP MAJEUR : le backend a livré D15/EPIC-025 (103/104/105 done le 2026-07-16 : catalogue de 8 permissions AVEC libellés, rôles système seedés non supprimables, perms[] dans le JWT, CRUD rôles, invitation plateforme org-less POST /admin/users, PATCH du rôle d'un opérateur) et AUCUNE story frontend ne le couvrait — alors que STORY-104 expose les libellés EXPLICITEMENT pour un panel. ⚠️ BLOQUÉE par STORY-106 : sans le proxy BFF, le front n'a aucune route vers /admin/roles et /admin/users, et le gating perms[] resterait COSMÉTIQUE (le BFF refuse tout non-PLATFORM_ADMIN à sa propre porte). Garde-fous backend à refléter dans l'UI : anti god-mode (on ne peut pas octroyer une permission qu'on n'a pas), anti-lockout (dernier 