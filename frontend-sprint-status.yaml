      - { id: "FE-057", app: "client", title: "Dette de contrat Atelier : régénération des types :3007 (mappingProfile→profilImportId) + gate sur `code: EMAIL_NOT_VERIFIED` — amende FE-024/FE-025", epic: "FE-EPIC-007", points: 5, status: "done", backend_ready: "done", backend_ref: "STORY-147,138,088,146", branch: "fe-057", completed_date: "2026-08-08", note: "✅ **MERGÉE dans `dev` le 2026-08-08** — commit `2cc2827`. ⚠️ **ET C'EST UN SHA DIFFÉRENT DE CELUI DE LA BRANCHE** (`beb4ce0`) : « Rebase and merge » REJOUE le commit, il ne le déplace pas. Conséquence vécue sur FE-058, qui était partie de `fe-057` : sa PR portait les DEUX copies du même changement et GitHub annonçait un conflit sur `src/i18n/messages/fr.json`. **Correctif : `git rebase origin/dev` sur la branche dérivée** — git reconnaît le commit déjà appliqué (`skipped previously applied commit`) et le retire tout seul ; puis force-push de la BRANCHE (jamais de `dev`). ⇒ **Règle : une branche empilée sur une autre doit être rebasée sur `dev` APRÈS le merge de sa base, pas avant.** — ⚡⚡ **PREMIÈRE STORY DU SPRINT — elle conditionne FE-056 ET FE-058** (les trois partent de la MÊME régénération de :3007 ; les tirer dans le désordre, c'est régénérer trois fois ou écrire des types à la main). ⚡ AJOUT 2026-08-06 — **STORY-146 est `done` depuis le 2026-08-03** et la régénération va la faire entrer, qu'on le veuille ou non : l'autorité sur le n° de compte passe du validateur (regex) au PLAN DE COMPTES DE L'ORGANISATION (6 chiffres en SYSCOHADA, normalisation des comptes Sage 8 chiffres/auxiliaires). Le tracker avait prévu « un passage de vérification, pas une story » : **ce passage est ICI**, en AC de FE-057 — vérifier que les comptes affichés par FE-025/026/027 gardent leur forme après agrégation des auxiliaires, et que la saisie ne re-bride pas côté client une règle qui vit désormais dans le référentiel. ⚠️ NE PAS y ajouter de regex de compte dans l'UI : ce serait recréer côté front l'autorité que le backend vient d'en retirer. — HISTORIQUE : ⚠️⚠️ PÉRIMÈTRE ÉLARGI ET RÉESTIMÉ 2→5 le 2026-08-01 — **STORY-147 a été LIVRÉE le 2026-07-31 au soir** et modifie le CONTRAT CANONIQUE de la balance. Ce n'est plus de l'hygiène de contrat, c'est une MIGRATION. Vérifié dans le code livré : (a) `LigneBalance` passe de 2 à 4 colonnes avec un renommage **cassant** `debit`/`credit` → `mouvementDebit`/`mouvementCredit` + ajout `soldeDebiteur`/`soldeCrediteur` (XOR : un compte est débiteur OU créditeur) ; (b) `SommaireBalance` devient IMBRIQUÉ — `sommaire.mouvements` / `sommaire.soldes`, chacun {totalDebit,totalCredit,ecart,estEquilibre}, plus un `estEquilibre` global = leur conjonction ; les anciens `totalDebiteur`/`totalCrediteur` DISPARAISSENT ; (c) checksum VERSIONNÉ `v2` + champ `checksumVersion` (absence = v1) ; (d) `POST /balances` exige les 4 champs, aucun optionnel, aucun dérivé (D-147-8). ⚡ IMPACT MESURÉ LE 2026-08-01 : **15 fichiers du front** portent `debit`/`credit` (sage-preview, saisie-directe-view, balance-detail-view, balances-list-view, balance-calculs, balance-checksum, saisie-model, saisie-sections, submit-balance + leurs tests). ⚡ POURQUOI UNE SEULE STORY : la régénération casse la compilation des 15 d'un coup — régénérer dans une story et réparer dans une autre laisserait le dépôt non compilable entre les deux. Les 3 écarts d'origine (138/088/types non typés) sont donc ABSORBÉS ici, ils sortent de la même régénération. ⚠️ **LE TEST DE PARITÉ DE CHECKSUM DE FE-026 VA CASSER** (`balance-checksum.test.ts`, HASH_ATTENDU `1864781c…`) — et le vecteur v1 du front porte une AUTRE FIXTURE que celle du backend : c'est le COUPLE (vecteur + jeu de données) publié par STORY-147 qu'il faut reprendre, pas le vecteur seul. v2 = `6c4a5008…`, v1 même fixture = `48f74471…`. ⚠️ VALEUR MÉTIER RÉELLE, pas seulement du retrofit : le double équilibre rend visible le **déséquilibre de soldes seul** (mouvements équilibrés), cas que le contrat à 2 colonnes laissait passer EN SILENCE — c'est le scénario ② de la vérif docker de 147. ⚠️ À FAIRE APRÈS LE MERGE DE FE-027 (la story touche `balance-detail-view.tsx`, que FE-027 vient de créer). ⚠️ NE PAS traiter en rechercher-remplacer : côté backend le renommage a RÉVÉLÉ deux lectures de la mauvaise grandeur (rapprochement bancaire comparant un solde au net des mouvements ; CA du régime fiscal juste par coïncidence) — `balance-calculs.ts` et `saisie-model.ts` ont la même exposition. — PÉRIMÈTRE D'ORIGINE (2026-07-31, absorbé) : solde les écarts que FE-024 et FE-025 avaient TRACÉS SANS PORTEUR. Trois objets, tous avec leur backend livré : (1) **STORY-138 `done`** (403 e-mail auto-descriptif, `code: EMAIL_NOT_VERIFIED` déployé sur les 7 relying-parties) ⇒ le gate de FE-024 peut enfin distinguer les trois motifs de refus par leur `code` au lieu d'en deviner un sur trois — c'était l'écart n°1 de FE-024 ; (2) **`mappingProfile` → `profilImportId`** (STORY-088) : renommage de contrat, les types générés de :3007 sont périmés — rien n'est cassé (FE-025 n'envoyait pas le champ) mais le contrat généré ment ; (3) **`referentiel`/`paquetFiscal`/`stamp` typés `Record<string,never>`** dans les types générés (écart n°3 de FE-024) — à revérifier après régénération, et à ouvrir en ticket backend s'ils sont toujours non typés à l'OpenAPI. ⚠️ Même piège que FE-055 : rebâtir l'image balance-service sur origin/dev AVANT `gen:api`, sinon on régénère depuis un stack périmé (précédent avéré en FE-INT-0). AUCUN écran neuf. ⚡ L'écart n°2 de FE-024 (registre `atelier` vs `balance`) est DÉJÀ corrigé — commit `FE-024 corrige la clé de jointure du module Atelier : \\`balance\\`, pas \\`atelier\\`` mergé dans dev." }
      - { id: "AP-INT-1", app: "admin", title: "La console atteignait-elle vraiment son backend ? — audit d'AP-INT-0 et réparation de trois défauts", epic: "AP-EPIC-000", points: 5, status: "done", backend_ready: "done", backend_ref: "STORY-075,109,047,013,032,033", note: "🆕 2026-08-04, ✅ EXÉCUTÉE (branche `ap-int-0`, même branche qu'AP-INT-0). ⚡ AP-INT-0 avait déclaré la console branchée ; l'audit montre que **le client KYC n'atteignait JAMAIS son service** : `/kyc/admin/kyc/:orgId` se résolvait en `:3002/api/v1/**kyc/**admin/kyc/:orgId` (route réelle : `/api/v1/admin/kyc/:orgId`) ⇒ 404 sur TOUS les dossiers, rendu à l'écran comme « aucun dossier ». ⚠️ 275 tests verts ne pouvaient pas le voir : ils mockent `apiFetch` et n'assertent donc que le chemin LOGIQUE, celui-là même qui était faux. CAUSE RACINE STRUCTURELLE : le préfixe `/admin` est monopolisé par le BFF depuis l'arbitrage d'AP-INT-0 ⇒ les routes admin de kyc-service n'avaient plus AUCUN préfixe atteignable ⇒ ajout de `/kyc-admin`, qui se RÉÉCRIT en `/admin/kyc`. 2 autres défauts : (b) `fetchKycFile` testait `error.status` alors qu'`ApiError` expose `statusCode` — branche morte, et le test la validait FAUSSE en fabriquant `{ status: 404 }`, une forme d'erreur que la prod ne produit jamais ; (c) la visionneuse DESSINAIT le document (`DocumentSheet`, 148 lignes reconstruites depuis le type de pièce + l'OCR) — l'opérateur croyait examiner un justificatif, il regardait un gabarit rempli par le front ⇒ composant SUPPRIMÉ, affichage du fichier réel à son URL présignée + `reviewStatus` préchargé. Aussi : 2 filtres SANS SERVEUR retirés d'AP-02 (statut KYC ⇒ STORY-175, vertical ⇒ STORY-171) et remplacés par `status` (identité), le seul servi ; exigences d'env remises à l'endroit (BFF et catalogue étaient OPTIONNELS alors que 3 écrans en dépendent ; EC était REQUIS alors qu'aucun écran ne l'appelle). 📊 lint 0 · tsc propre · 287 tests unitaires (275→287) · Integration Gate 22→29. ⛔ 6 MANQUES BACKEND découverts en réparant ⇒ ticket + STORY-179→184 (backend S20) ⇒ toutes les vérifications qui en dépendent sont regroupées dans **AP-INT-2**." }
      - { id: "FE-058", app: "client", title: "Valider ou rejeter une balance depuis l'écran de détail — la route promise depuis FE-026 existe enfin (amende FE-026/FE-027)", epic: "FE-EPIC-007", points: 3, status: "review", backend_ready: "done", backend_ref: "STORY-145", branch: "fe-058", completed_date: "2026-08-08", note: "✅ LIVRÉE le 2026-08-08 (branche `fe-058`, PARTIE DE `fe-057` — `origin/dev` était encore sur FE-056 et la PR de FE-057 n'était pas fusionnée ; coder depuis `dev` aurait imposé d'écrire à la main les types que FE-057 régénère). Bloc d'action sur le détail, ABSENT hors BROUILLON (jamais grisé : aucune réouverture n'existe côté service). Motif obligatoire ≤ 500, espaces seuls refusés côté client ; confirmation explicite de l'irréversibilité sur la SEULE validation. Le 409 est discriminé À UN SEUL ENDROIT (`lib/balance-conflit.ts`, union discriminée) : aucun composant ne teste un `code` en ligne. QUALITÉ : typecheck · lint 0 warning · build verts ; 506 unitaires (+34) ; E2E `atelier-balance-validation.spec.ts` 7 cas verts en vrai navigateur. ⚠️ DEUX TROUVAILLES À RETENIR : (1) **l'enveloppe d'erreur du front JETAIT `details`** — `normalizeErrorBody` ne gardait que {statusCode, error, message, code}, la liste des contrôles bloquants n'atteignait JAMAIS l'écran et l'AC-4 était intenable en l'état ; le champ est désormais transporté tel quel, typé `unknown` (sa forme dépend du `code`, et la plupart des erreurs n'en portent aucun). (2) **un `next start -p 3100` d'une session précédente faisait échouer TOUT l'E2E**, y compris la spec FE-027 déjà verte : `reuseExistingServer` réutilisait un build périmé — diagnostic `netstat -ano | grep :3100`, à faire AVANT de conclure qu'un E2E est cassé. ℹ️ Les codes réels sont `BALANCE_DEJA_VALIDEE` / `BALANCE_ETAT_INCHANGE` (et non DEJA_VALIDEE / ETAT_INCHANGE) : les constantes sont dérivées des types générés via `satisfies`, un renommage backend casserait la compilation. ⛔ INTEGRATION GATE NON FAIT (stack docker arrêté) — à solder EN LIVE contre le :3007 sur une balance réellement produite par une org entitled/KYC-approuvée. ⏳ RESTE : rebase sur `dev` après le merge de FE-057, puis PR. — CADRAGE D'ORIGINE : 🆕 CRÉÉE 2026-08-06 — LA STORY MANQUAIT, et le tracker l'avait pourtant COMMANDÉE : la note de FE-027 dit mot pour mot « ⚡ À sa livraison : ouvrir une story frontend d'amendement de FE-027 ». **STORY-145 est `done` depuis le 2026-08-03** (PR balance-service#26, `POST /balances/:id/valider|rejeter`, vérifié dans `balance.controller.ts` sur origin/dev) et personne n'a ouvert la story : pendant trois jours la suite n'existait que dans la note d'une story `done`, c'est-à-dire nulle part pour le sprint-planning. C'est le MÊME défaut de chaînage qu'AP-12 (STORY-149) et AP-21 (STORY-175) — trois occurrences en une semaine. 🎯 CE N'EST PAS UN CONFORT D'ÉCRAN : c'est le 1er maillon de **FE-039** (e2e « balance→liasse→validation→export », jalon Module 1), infranchissable sans lui — `GAP-balance-validation-etat` se ferme ici. ⚠️ ORDRE : APRÈS FE-057 (elle régénère les types :3007 d'où sortent `MarquerEtatDto` et les DTO de conflit ; coder avant = écrire les types à la main, la dette exacte que FE-057 solde) et sur `balance-detail-view.tsx`, que les deux touchent. ⚠️ PIÈGE PUBLIÉ PAR LE BACKEND : le **409 a DEUX corps** en `oneOf` discriminés par `code` (`DEJA_VALIDEE` | `CONTROLES_BLOQUANTS`) — figer le rendu sur `CONTROLES_BLOQUANTS` lirait un `details.bloquants` ABSENT du refus le plus fréquent (balance déjà figée). ⚠️ Le rejet n'est PAS gardé par les contrôles (délibéré : « refuser un rejet parce que des contrôles échouent enfermerait la balance fautive ») ⇒ ne pas désactiver Rejeter quand Valider est refusé. ⚠️ `auteur` JAMAIS au corps (dérivé du seul JWT, whitelist stricte ⇒ 400). ⚠️ Validation IRRÉVERSIBLE, aucune réouverture n'existe côté backend : ne pas dessiner un bouton qui suggérerait le contraire. HORS PÉRIMÈTRE : l'interprétation des contrôles bloquants (c'est FE-053 / STORY-098, `not_started`) — ici on rend la liste telle qu'elle arrive." }
