      - { id: "AP-09", app: "admin", title: "Mot de passe oublié — récupération de compte pour les opérateurs plateforme (console admin)", epic: "AP-EPIC-000", points: 2, status: "review", backend_ready: "done", backend_ref: "STORY-125", note: "✅ **LIVRÉE 2026-08-08** — branche `AP-09-12` (commit aa6cef7), ⚠️ COMMUNE avec AP-12 sur demande du PO : la PR porte DEUX stories. tsc 0 · lint 0 ERREUR · **450 tests verts** (406→450, AP-09+AP-12) · build 15 routes · **e2e 6/6 en vrai navigateur**. Types RÉGÉNÉRÉS (ForgotPasswordDto/ResetPasswordDto générés + garde de compilation). ⚡ GATE PROUVÉE de bout en bout sur admin@prospera.local : 202 identique pour adresse connue ET inconnue → lien lu dans MAILHOG pointant sur :3110 (et non :3100 — LE critère qui distingue AP-09 de FE-020) → 204 → jeton à USAGE UNIQUE (400 au rejeu) → reconnexion 200 avec les 13 perms. ⚡ TROUVAILLE : le 400 de l'IdP recouvre DEUX causes (jeton mort / mot de passe refusé) qu'on ne peut PAS trier sur le texte — le tri se fait sur la FORME du corps (message en TABLEAU = ValidationPipe = mot de passe ; message simple = jeton), les deux formes relevées sur l'IdP réel. Un mauvais tri ne fait pas un message maladroit mais une IMPASSE : il fait perdre un jeton valide. ⚠️ ÉCART D'ENVIRONNEMENT (infra, PAS backend, PAS cette story) : le .env.local du dépôt pointe les services sur une IP de LAN injoignable depuis la machine de dev — le BFF y timeoute sur TOUTES ses routes d'auth, LOGIN D'AP-01 COMPRIS. Vérification menée avec override localhost. À trancher : 2 profils d'env, ou une IP joignable des deux côtés. Historique du déblocage : 🔓 DÉBLOQUÉE 2026-07-26 — STORY-125 est LIVRÉE (done, S16 backend, mergée sur dev, vérifiée docker sur les 2 personas dont PLATFORM_ADMIN : le lien plateforme pointe sur :3110 via PASSWORD_RESET_URL_PLATFORM). Le blocage backend est LEVÉ. ⚠️ Dépendance RÉSIDUELLE : AP-01 (socle admin-panel : BFF + login PLATFORM_ADMIN) — le dépôt admin-panel ne contient à ce jour que le BFF (MNV-046→107), aucune UI. AP-09 n'a besoin QUE des 2 Route Handlers publics du BFF (pass-through), pas du shell authentifié, mais il faut le projet AP-01 en place pour les héberger. ⇒ livrable dès qu'AP-01 est fait. — HISTORIQUE : 🆕 2026-07-22 — DEMANDE EXPLICITE DU PO (« mais aussi au niveau de l'admin-panel »). ⚠️ C'EST ICI QUE LE TROU EST LE PLUS GRAVE : les comptes plateforme sont SEEDÉS (seed-platform-admin.ts) ou créés par invitation org-less (STORY-104), et platform-users.controller.ts n'expose que POST/GET/PATCH-rôle ⇒ AUCUN PLATFORM_ADMIN ne peut débloquer un PLATFORM_KYC_OFFICER qui a oublié son mot de passe → seule issue actuelle = rejouer un seed À LA MAIN EN PRODUCTION. Impasse d'exploitation. STORY-125 traite les 2 publics avec LE MÊME CODE ⇒ AP-09 est délibérément MINCE : 2 pages + 2 Route Handlers de pass-through dans le BFF (le panel est un BFF SANS BASE, il ne possède aucune identité). ⚡ AC DISTINCTIF vs FE-020 : le lien reçu par e-mail doit ramener SUR LA CONSOLE, pas sur l'app cabinet — le backend déduit la cible du compte (platformRole → PASSWORD_RESET_URL_PLATFORM) ; à prouver en bout-en-bout, lien lu dans Mailhog, sur un VRAI compte plateforme. ⚡ PIÈGE N°1 : les 2 écrans ET les 2 routes du BFF sont PUBLICS — ne pas les placer derrière la garde PLATFORM_ADMIN d'AP-01 ni les proxifier avec un jeton (elles sont appelées PAR DÉFINITION par quelqu'un qui n'est pas connecté) ; test dédié. Anti-énumération d'autant plus sensible ici que l'annuaire visé est celui des employés Money Vibes. Le BFF ne journalise NI le corps NI le token (le token vaut le compte)." }
      - { id: "FE-017", app: "both", title: "e2e inter-apps : l'admin octroie → le module apparaît côté client (Playwright, stack docker réel)", epic: "FE-EPIC-006", points: 3, status: "review", backend_ready: "done", backend_ref: "STORY-034,048", branch: "fe-017", completed_date: "2026-08-09", note: "✅ **LIVRÉE 2026-08-09** — dépôt `frontend-admin-panel` (c'est lui qui déclenche), branche `fe-017`, commit `b85e34d`. `e2e/entitlement-loop.spec.ts` + **configuration ET script dédiés** (`playwright.loop.config.ts`, `npm run e2e:loop`, miroir du `test:chain` backend) : mettre le 2ᵉ serveur dans la config ordinaire ferait dépendre TOUS les e2e de la console (`login`, `app-shell`, `kyc-chain`…) d'un dépôt qu'elle ne versionne pas. **4 exécutions consécutives VERTES** (53 s → 1 m 54), `retries: 0`, deux vrais serveurs Next, zéro mock. ⚡ **LE TEST COUVRE DEUX PATTES DE NATURES DIFFÉRENTES, et c'est le point** : l'accueil du cabinet lit `GET /catalog/entitlements/:orgId` EN DIRECT (simple écho de l'écriture qu'on vient de faire) ; la preuve de la PROPAGATION, c'est l'ENTRÉE dans le module (`/referentiels/actifs`, gardée par `@RequiresBalanceAccess`, qui lit le read-model alimenté par Kafka). Un test arrêté à la carte de l'accueil resterait **vert avec la chaîne d'événements morte**. Les deux sont vérifiées, à l'octroi COMME à la révocation. ⛔⛔ **TROUVAILLE N°1 — LA CONSOLE NE POUVAIT PLUS OCTROYER, corrigé ici** : `toCatalogModule()` JETAIT `referentielFamilies` sur la foi d'un écart d'Integration Gate devenu faux (**STORY-148 est livrée**, le service sert le champ, l'OpenAPI le déclare) ⇒ `requiresReferentiel()` faux pour TOUS les modules ⇒ le formulaire annonçait « ne consomme aucun référentiel normatif », n'offrait aucun sélecteur, envoyait un PUT sans référentiel ⇒ **400 `REFERENTIEL_REQUIRED`**. Or **`balance` est le SEUL module octroyable du catalogue** : l'octroi était mort. Aucun test unitaire ne pouvait le voir (les fixtures portent toutes leurs familles). ⛔⛔ **TROUVAILLE N°2, HORS PÉRIMÈTRE, À SLOTTER** : **STORY-182 est livrée** — `If-Match` (ETag du dossier) est OBLIGATOIRE sur `approve`/`reject`, sinon **428**, reproduit au curl ; or `kyc-client.ts` n'en envoie AUCUN alors que ses types générés le déclarent requis ⇒ **la revue KYC de la console ne peut plus rien approuver ni rejeter**, et `kyc-chain.spec.ts` (jalon 🏁 du S4) est ROUGE. C'est le sujet d'**AP-INT-2** : à y rattacher ou à ouvrir. + `kyc-chain.spec.ts` vise encore MailHog sur `:8025` alors que le compose le décale en `8026`. ⚠️ TROUVAILLE N°3 : « Identifiants invalides » recouvre TOUT `ApiError` dans les DEUX apps (`login-form.tsx`) — un **429 de quota s'affiche comme un mauvais mot de passe**, et l'utilisateur va réinitialiser un mot de passe qui n'a rien ; même famille que la trouvaille d'AP-09. ~30 min de diagnostic perdues ici, IdP répondant **200 neuf fois sur neuf** pendant que l'écran accusait les identifiants ⇒ le test capte désormais le STATUT RÉEL du BFF et le met dans son message d'échec. **À traiter dans une story.** ⚠️ TROUVAILLE N°4 : le quota IdP est **GLOBAL par IP** (100 req/60 s), pas par compte ni par route — une attente sur condition qui recharge la page chaque seconde épuise le budget et fait échouer la CONNEXION DE L'EXÉCUTION SUIVANTE ; traité par une cadence espacée (2/5/10 s) et un réessai après une fenêtre entière. ⚠️ TROUVAILLE N°5 : le `.env.local` du dépôt cabinet pointe `10.199.13.113`, injoignable (celui de la console dit `10.169.144.113` — les deux ne peuvent pas être vrais) ; les `NEXT_PUBLIC_*` étant inlinées AU BUILD, la config de la boucle IMPOSE `localhost` aux deux builds sans toucher aux fichiers du développeur. Même écart d'environnement qu'AP-09 : toujours à trancher. ⚡ **3 ÉCARTS ASSUMÉS vs le texte de la story** : (1) le module octroyé est **`balance`, pas `bilan`** — `bilan` n'a AUCUNE version publiée au catalogue réel (listé `disabled`, « aucune version publiée ») et fabriquer une version pour faire passer un test reviendrait à inventer l'état qu'on prétend observer ; `balance` est en outre le seul module dont un service consomme `entitlement.changed`, donc le seul qui ait une patte asynchrone ; (2) le module **ne disparaît pas** de l'accueil, il change d'état — FE-014 affiche tous les modules et dit pourquoi chacun est fermé, l'observable est le LIBELLÉ ; (3) après révocation l'état est **« Suspendu »**, pas « Non activé » : la révocation passe l'octroi à `REVOKED`, elle ne l'efface pas. 📊 typecheck 0 · lint 0 erreur · **506 unitaires verts**. — HISTORIQUE : 🔓 **DÉBLOQUÉE 2026-08-06 — LES DEUX CONDITIONS SONT REMPLIES**, et elles l'ont été à trois jours d'intervalle : (1) l'UI d'octroi existe (AP-05 mergée le 31/07), (2) elle appelle le VRAI service (AP-INT-0 mergée le 03/08 — piloter une console sur fixtures aurait produit un test vert qui ne prouve rien, ce qui était la seconde moitié du blocage et n'avait jamais été écrite comme telle). C'EST LA STORY LA PLUS IMPORTANTE DU SPRINT : sans elle, les deux démos de boucle qui structurent tout le plan (S4 KYC, S5 entitlement) restent des gestes manuels qu'un refactor peut casser en silence. ⚠️ Elle traverse DEUX dépôts et DEUX ports — console :3110, cabinet :3100 (jamais :3000, qui est expert-comptable) ; le piège `reuseExistingServer` de FE-INT-4 et d'AP-INT-0 se rejoue ici à l'identique, en double. ⚠️ Leçon d'AP-INT-1 à appliquer AVANT d'écrire le test : un e2e qui MOCKE `apiFetch` n'asserte que le chemin logique — c'est exactement ce qui a laissé 275 tests verts couvrir une revue KYC qui n'atteignait jamais son service. Ici, stack docker réel ou rien. — HISTORIQUE : ⚠️ BLOQUÉE 2026-07-24 malgré backend_ready=done : le test pilote la CONSOLE ADMIN (« se connecter en PLATFORM_ADMIN → octroyer l'entitlement »), or le FRONT admin-panel n'existe pas — AP-01→AP-07 sont tous `ready-for-dev`, le dépôt admin-panel ne contient que le BFF (MNV-046→107), aucune UI. Le test n'a rien à piloter tant qu'AP-05 (grant/revoke UI) n'est pas livrée. Débloquer après AP-05. — HISTORIQUE : 🆕 2026-07-17 — première story `app: both`. Fige la boucle dogfooding comme test de non-régression : sans elle, rien ne garantit que le grant admin reste visible côté client après un refactor. Miroir frontend du `npm run test:chain` backend (STORY-049)." }
      - { id: "FE-055", app: "client", title: "Régénération des types depuis l'OpenAPI corrigé (dette de contrat STORY-130 + STORY-132) — amende FE-INT-0 et FE-021", epic: "FE-EPIC-002", points: 2, status: "ready-for-dev", backend_ready: "done", backend_ref: "STORY-130,132,133", note: "⚡ PÉRIMÈTRE ÉLARGI 2026-08-06, SANS RÉESTIMATION — **STORY-132 est `done` (2026-08-06)** : `SessionResponseDto` déclare enfin `userAgent`, `ip` et `role` comme des CHAÎNES à l'OpenAPI. C'est la MÊME régénération d'auth-service que STORY-130, sur le MÊME dépôt : les séparer en deux stories ferait tourner `gen:api` deux fois et laisserait le front avec des casts manuels entre les deux. ⇒ retirer aussi les contournements de type de l'écran « Sessions ouvertes » (FE-021). ⚡ ET UNE VÉRIFICATION QUI N'EST PAS UNE STORY : **STORY-133 est `done` (2026-08-06, 8 PR — proxy de confiance X-Forwarded-For sur tous les services)**. L'IP affichée par « Sessions ouvertes » cesse d'être celle du BFF Next et devient celle de l'appareil — c'est le point ouvert que la mémoire du programme traçait depuis FE-021 (« le BFF masque le navigateur ; l'IP reste à trancher »). Il est tranché. À CONSTATER dans un vrai navigateur au passage de cette story, pas à re-spécifier. — HISTORIQUE : 🆕 2026-07-26 — retrofit du socle contractuel FE-INT-0 : STORY-130 (LIVRÉE, S16) a corrigé 5 écarts de l'OpenAPI de l'IdP (organization $ref nullable sur /users/me · MessageResponseDto sur 6 routes {message} · forgot-password 202 pas 200 · verify-email {message} = le ticket backend tracé par FE-INT-4, refermé · JwksResponseDto). Le front DÉRIVE ses types de l'OpenAPI ⇒ tant qu'il ne régénère pas, les types générés restent FAUX mais verts. Portée : gen:api auth-service sur stack docker origin/dev à jour → committer src/types/api/ → retirer les types manuels/casts de contournement → forgot-password traité en 202. AUCUN écran neuf, pure qualité de contrat. ⚠️ rebâtir l'image auth AVANT gen:api (piège checkout périmé)." }
      - { id: "AP-12", app: "admin", title: "Dépôt effectif d'un paquet de référentiel depuis la console (téléversement réel + publication versionnée) — amende AP-04", epic: "AP-EPIC-002", points: 3, status: "review", backend_ready: "done", backend_ref: "STORY-149", note: "✅ **LIVRÉE 2026-08-08** — branche `AP-09-12` (commit aa6cef7), ⚠️ COMMUNE avec AP-09. tsc 0 · lint 0 ERREUR · 450 tests verts · build 15 routes · e2e 6/6 (dont le PRÉFLIGHT CORS du POST multipart, qu'aucun curl n'émet). Types RÉGÉNÉRÉS. Confronté au vrai catalogue :3003 — dépôt 201 (checksum SERVEUR, hosted:true, zone, artifactSize) · 409 VERSION_EXISTS · 422 CHECKSUM_MISMATCH · 415 UNSUPPORTED_TYPE (type vérifié sur le CONTENU). Le registre sert bien hosted:true vs false ⇒ la colonne PROVENANCE lit une donnée réelle (3 états : Déposée / Pointeur / Inconnue — hosted ABSENT n'est PAS false). ⛔ **POINT 2 DE LA GATE : RE-TESTÉ le 2026-08-08, il n'est pas « non fait » mais INEXÉCUTABLE** — aucun consommateur ne lit le stockage objet. Preuve docker : balance-service ne peut charger que 3 assets EMBARQUÉS dans son image (syscohada-revise-2.1, sfd-bceao-2.0, paquet-fiscal-togo-2026) pendant que le dépôt écrit dans MinIO (referentiels/ap12-verif/1.0/…) ; les deux ensembles ne se croisent JAMAIS et aucun code ne les relie — le port ArtifactSource n'a QU'UNE implémentation (BundledArtifactSource, lit dist/…/assets), et un grep minio|s3://|S3Client|getObject sur balance-service/src + bilan-service/src ne rend RIEN. ⚡ Détail qui ferme le débat : BundledArtifactSource valide son locator contre /^[A-Za-z0-9._-]+$/ — l'artifactUri `s3://…` que le catalogue enregistre serait REJETÉ d'emblée. Les stories réglées l'expliquent : STORY-038 (done) écrit « MinIO différé (seam via port ArtifactSource) », STORY-149 (done) met « la vérification au CHARGEMENT — bilan-service, inchangé » HORS PÉRIMÈTRE, et STORY-292/293 (ready-for-dev, ticket referentiels-attribuables-mais-non-servis) traitent la face VOISINE (manifeste embarqué + valeur de version), pas le raccord aux octets DÉPOSÉS. ⇒ AUCUNE story ne couvre ce port ; il est BACKEND, pas frontend. **Décision PO demandée** : AP-12 `done` sur le périmètre console (le raccord devenant une story backend à slotter), ou maintenue en review sur un développement backend jamais planifié. ✅ AC-3 « hors fenêtre N/N-1 » : RÉGLÉ PAR STORY-032 (done) — le garde-fou est sur ModuleVersionsService, ReferentielVersion est un schéma ORTHOGONAL et n'a jamais eu de fenêtre de support ; la mention dans l'AC-3 d'AP-12 est une ERREUR DE RÉDACTION, pas un contrat manquant. Aucune story à ouvrir. ⚠️ Résidus dans le catalogue de dev : ap12-verif@1.0 et quelques ap12-e2e@… (un paquet publié est IMMUABLE, aucune route ne supprime). Historique du déblocage : 🔓 **DÉBLOQUÉE ET DÉPLACÉE DU S12 AU S9 le 2026-08-06** — le DOUBLE BLOCAGE est levé des deux côtés : (a) **STORY-149 est `done` (2026-08-05)**, livrée en 4 PR rebase-mergées ENSEMBLE (platform-catalog-service#12 + auth-service#17 + kyc-service#11 + admin-panel#13) — le guard vit dans le catalogue, la permission `referentiel:publish` est propagée aux 4 recopies K4 ; (b) **AP-INT-0 est mergée**, `catalog-client.ts` appelle le vrai service, il existe donc un chemin réseau à emprunter. ⚠️ LE POINT DE CONCEPTION EST CONFIRMÉ PAR LE CODE LIVRÉ : le commit s'appelle littéralement « dépôt d'un paquet de référentiel, **sha256 calculé par le serveur** » — l'empreinte calculée dans le navigateur par AP-04 devient une AIDE À LA VÉRIFICATION, pas la source de vérité. L'écran affiche le checksum SERVEUR et SIGNALE la divergence (information de sécurité, pas erreur technique). ⚠️ Le dépôt est BORNÉ (correctifs CWE-770/CWE-778 de MNV-149) : un fichier hors limites est refusé, pas avalé — le rendre actionnable. — HISTORIQUE : 🆕 CRÉÉE 2026-08-01 — la story MANQUAIT. AP-04 a livré l'écran de dépôt d'un paquet en disant HONNÊTEMENT qu'il ne téléverse rien (« le fichier n'est PAS téléversé — aucune route de dépôt côté service = STORY-149 »), mais AUCUNE story ne portait le raccordement une fois la route livrée : la suite n'existait que dans la note d'une story déjà `review`, c'est-à-dire nulle part pour le sprint-planning. ⛔ DOUBLE BLOCAGE : STORY-149 est `draft` et dans AUCUN sprint backend (cf. orphan_stories), et AP-INT-0 doit être livrée avant (tant que catalog-client.ts est sur fixtures, il n'y a aucun chemin réseau à emprunter). ⚡ POINT DE CONCEPTION : AP-04 calcule le sha256 DANS LE NAVIGATEUR ; STORY-149 le calcule CÔTÉ SERVEUR, et c'est le serveur qui a raison — un checksum fourni par l'appelant atteste de ce que le client a LU, pas de ce que le service a reçu, or c'est l'ancre d'intégrité revérifiée au chargement (STORY-038). La valeur locale devient une AIDE À LA VÉRIFICATION : l'écran affiche le checksum serveur et SIGNALE la divergence, qui est une information de sécurité. ⚠️ Leçon FE-023 transposée : un paquet déposé ne se vérifie qu'en le faisant CHARGER par le service qui l'utilisera (balance-service via ReferentielLoader)." }
      - { id: "AP-20", app: "admin", title: "Suspendre et rétablir une organisation — la route existe depuis des mois, aucun écran ne l'appelle", epic: "AP-EPIC-001", points: 3, status: "review", backend_ready: "done", backend_ref: "STORY-027,STORY-144", note: "✅ **LIVRÉE 2026-08-07** (branche `ap-20`) — tsc 0 · **390 tests verts** (372→390) · build 10 routes · **lint 0 ERREUR**. ⚖️ **DEUX ARBITRAGES PO RENDUS CE JOUR.** (1) **VOIE D'ACCÈS = préfixe logique dédié `/auth-admin`**, réécrit en `/admin/organizations` sur `NEXT_PUBLIC_AUTH_URL` — la 2ᵉ des deux issues nommées ci-dessous, celle qui ne demande AUCUN travail backend (le CORS d'auth-service couvre déjà :3110, il sert la connexion). Le contrat de préfixes reste stable : le jour où le BFF les proxifie, une seule ligne change. (2) **LE RENVOI D'INVITATION EST ENTRÉ DANS LE PÉRIMÈTRE** : la route de STORY-144 existe et DEUX boutons de la console affichaient « Invitation renvoyée à X » sans rien appeler — même défaut qu'AP-22, laissé dans un angle mort parce que le « Inclus » de la story ne le listait pas. 🔎 **TROIS TROUVAILLES.** (a) ⚠️ **LE 409 DES CRITÈRES D'ACCEPTATION N'EXISTE PAS** : `suspend` et `reactivate` sont IDEMPOTENTES et ne rendent que 200/403/404 — les seuls 409 du périmètre sont ceux du renvoi (`ALREADY_ACTIVATED`, `NO_INVITED_ADMIN`), plus un 429 de quota 3/h **par organisation** que le critère ne mentionnait pas. Le mapper d'erreurs REFUSE donc de lire un 409 hors du renvoi (test dédié) : traduit sans garde, il aurait affiché « cet administrateur a déjà activé son compte » au terme d'une suspension. (b) **Le claim `perms` n'était pas décodé** (`claims.ts` s'arrêtait à `roles`) — sans lui, « absente et non grisée » était intenable : l'action ne pouvait qu'apparaître pour tout le monde ou pour personne. Ajout strictement additif, affichage seulement. (c) **`OrganizationMemberDto.status` porte le statut UTILISATEUR** (`m.userStatus`) et il était JETÉ par `toSummary` — c'est lui qui dit `INVITED`, donc lui qui permet de ne montrer le renvoi que là où il peut aboutir. 🔧 **RETRAITS ASSUMÉS** : suspension groupée ET renvoi groupé retirés de la maquette — le premier est hors périmètre par décision de story (une confirmation ne peut pas nommer une conséquence qui diffère par organisation), le second est intenable au contrat (12 lignes → 12 réponses 202/409/429 qu'une barre d'actions ne sait pas restituer). ⚠️ **CE QUI RESTE OUVERT, ET QUI N'EST PAS DE CETTE STORY** : les actes SONT audités (`admin_audit_logs`, append-only, même transaction) et **aucune route ne les relit** ⇒ encart « Historique : à livrer » sur la fiche, ticket backend `GET /admin/organizations/:id/audit` à ouvrir. 🩹 **DETTE D'AP-22 RÉPARÉE AU PASSAGE** : `npm run lint` était ROUGE sur `dev` (`react-hooks/set-state-in-effect` dans `deprecate-dialog.tsx`) — la remise à zéro passe du `useEffect` au rendu, ce qui supprime aussi la frame où la date de l'ouverture précédente était réellement affichée. 🎨 Maquette republiée sur la MÊME URL (https://claude.ai/code/artifact/3783c8a0-6d79-483e-a2fc-7556fff2d312), comme la consigne d'AP-22 l'a fixé. — HISTORIQUE : ⚡ **DÉPLACÉE DU S10 AU S9 le 2026-08-06** — elle n'a plus AUCUNE part conditionnelle : STORY-144 est mergée, suspendre ET rétablir se livrent ensemble, aucun encart « à livrer » à prévoir. Elle rejoint AP-12 et AP-22 sous le même thème : la console cesse d'afficher des portes qui ne s'ouvrent pas. ⚠️ L'ARBITRAGE DE VOIE D'ACCÈS EST DÉSORMAIS TRANCHÉ EN AMONT et il faut le suivre : AP-INT-0 a réservé le préfixe `/admin` AU BFF, et le BFF ne proxifie PAS `suspend` (`admin-org-actions.controller.ts` ne porte que kyc/approve, kyc/reject, entitlements PUT/DELETE). Deux issues seulement — l'ajouter au BFF, ou appeler auth-service par un préfixe DÉDIÉ à la manière du `/kyc-admin` d'AP-INT-1. Ne pas improviser un 3ᵉ chemin. — HISTORIQUE : NOUVELLE 2026-08-06 — AUDIT DES ACTIONS DE LA CONSOLE. auth-service expose TROIS routes sur les organisations ; la console n'en appelle que deux : POST /admin/organizations/:id/suspend n'est JAMAIS appelée. Vérifié : aucune méthode d'écriture dans orgs-client.ts, aucun bouton dans orgs-table.tsx ni org-detail.tsx. À PORTER AU CRÉDIT DE L'EXISTANT : les actions inertes signalées par la note d'AP-02 (« toast seul ») ont été RETIRÉES, pas laissées mortes — l'écran est incomplet, il ne ment pas. CHAÎNAGE MANQUANT : STORY-144 (réactivation + renvoi d'invitation, S20) n'était consommée par AUCUNE story frontend — AP-02 la cite comme dette, AP-16 traite un autre sujet (couper pour impayé, pas par décision d'administration). PARTIEL : suspendre est servi AUJOURD'HUI (STORY-027), rétablir attend STORY-144 — d'ici là, encart « à livrer » et AUCUN bouton mort. RÉANCRÉE 2026-08-06 après git pull : MNV-144 EST MERGÉE sur origin/dev d'auth-service. Les trois routes existent (suspend + reactivate + resend-invitation org-level), et les actes sont AUDITÉS dans admin_audit_logs (append-only, même transaction) — mais AUCUNE route ne lit ce journal. backend_ready passe de partiel à done : les deux gestes se livrent ensemble, aucun encart de manque à prévoir. À TRANCHER AVANT DE CODER : le BFF ne proxifie pas suspend (admin-org-actions.controller.ts porte kyc/approve, kyc/reject, entitlements PUT/DELETE — pas suspend) ; soit on l'ajoute au BFF, soit l'appel part en direct sur auth-service." }
