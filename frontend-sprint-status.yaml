  # ══════ PLAN FORWARD — reconstruit le 2026-08-01, RÉORGANISÉ le 2026-08-07 ══════
  #
  # ⚡ RÈGLE STRUCTURANTE APPLIQUÉE LE 2026-08-07 (demande PO : « ce qui est déjà débloqué doit être
  #   fait vite, ce qui ne l'est pas va dans des sprints futurs ») :
  #
  #     **UN SPRINT EST SOIT INTÉGRALEMENT ACTIONNABLE, SOIT INTÉGRALEMENT EN ATTENTE.
  #       JAMAIS LES DEUX.**
  #
  #   Pourquoi cette règle et pas un simple tri : une story bloquée logée dans un sprint par
  #   ailleurs actionnable ne se contente pas d'être en retard, elle FAUSSE LE SPRINT. Elle occupe
  #   de la capacité au tableau, elle fait paraître plein un sprint qui ne l'est pas, et le jour de
  #   la revue on constate un sprint « non terminé » pour une raison que personne ne contrôlait.
  #   C'est exactement ce que faisaient AP-INT-2 (S8 puis S9), AP-19 et AP-21 (S10) : 8 points
  #   répartis sur trois sprints proches, tous suspendus au MÊME sprint 20 backend.
  #
  #   ⇒ **S8 → S17 : 149 pts, zéro dépendance ouverte.** Dix sprints à ~15 pts, exécutables dès
  #     aujourd'hui, dans l'ordre. Aucun n'attend quoi que ce soit.
  #   ⇒ **S18 + S19 : 19 pts, un amont UNIQUE — le sprint 20 BACKEND.** Tout ce qui attend ce
  #     sprint-là y est regroupé : conseil fiscal et contrôles côté cabinet (S18), dette de la
  #     console (S19). Le jour où le backend le livre, ces deux sprints se débloquent d'un coup.
  #   ⇒ **S20 → S27 : 126 pts, amont = sprints backend 30→33** (distributeur, PI-SPI, paiement).
  #   ⇒ **S28 : différé** (terrain natif, dépôt à créer).
  #
  #   ⚠️ CE QUE LA RÈGLE NE DIT PAS, ET QUI COMPTE AUTANT : le numéro de sprint dit l'ORDRE DE
  #   PRIORITÉ, pas une date. Une story du S19 se tire le jour où son backend tombe, même si l'on
  #   en est au S12 — c'est écrit dans AP-INT-2. Regrouper le bloqué ne le repousse pas, ça le rend
  #   VISIBLE ET TIRABLE EN UN SEUL ENDROIT au lieu de le disséminer.
  #
  #   Règle d'origine (2026-08-01), toujours en vigueur : un sprint ne contient QUE des stories dont
  #   le backend est DÉJÀ intégré — les seules exceptions sont nommées dans `backend_dependency`.
  #   Chaque sprint mêle console et app cliente dès que la valeur le justifie (principe 0, tranches
  #   verticales).
