last_updated: "2026-08-19"  # 🆕 **AP-25 LIVRÉE (4ᵉ passe du jour)** — le pack Finance cesse d'attribuer `sfd-bceao@1.3`, une version qu'aucun des deux services ne package. ⚠️ **La story annonçait un TRANSFERT (bundle prêt chez l'auteur backend) : le bundle est introuvable sur cette machine** ⇒ code réécrit depuis la fiche, qui reproduisait le diff en clair — et c'est ce qui a permis de **constater** les deux pièges qu'elle disait de ne pas réimplémenter de mémoire, au lieu de les croire. ⚡ Le plus instructif : **next-intl ne laisse aucune accolade à l'écran** quand une interpolation manque, il affiche le chemin de clé `provisioning.blocked.referentiel-missing` — prouvé par mutation. — Historique — 🆕 **AP-28 FERMÉE SANS OBJET — PROPAGATION (3ᵉ passe du jour)** : la fermeture était écrite dans la fiche et les compteurs, mais **trois endroits la contredisaient encore** — `tickets/README.md` disait deux fois « AP-28 fait foi » (le ticket CIMA pointait donc toujours sur un dépôt qui n'a jamais consommé `balance-service`), la liste d'épics rangeait AP-28 dans AP-EPIC-001 sans marque, et **FE-070 était rattachée à `FE-EPIC-006` (« Accès modules & entitlements ») alors que sa propre fiche la nomme « Atelier Balance » = `FE-EPIC-007`** — un numéro faux avec le bon libellé, invisible à la lecture. ⚡ **Une story fermée n'est fermée que là où on l'a écrit** : le renvoi périmé d'un index de tickets garde l'ancienne vérité active exactement comme le commentaire d'écart de FE-017. — Historique — 🆕 **AP-24 LIVRÉE (2ᵉ passe du jour)** — branche `ap-24` : la console lit enfin le journal d'audit qu'elle alimentait, l'encart « à livrer » d'AP-20 disparaît, et la confirmation demande un motif (arbitrage ③ de STORY-294, dans les deux sens). ⚠️ **Deux écarts trouvés en chemin** : les types de STORY-294 n'étaient PAS sur `dev` (ils vivaient sur `ap-27`, non fusionnée — c'est `tsc` qui l'a dit) ; et `[hidden]` ne masquait rien dans le prototype de la console, d'où une saisie de date d'AP-22 affichée sur TOUTES les confirmations. Ticket backend du journal d'audit **stampé résolu**. — Historique — v5.6.0 — réancrage sur `origin/dev` des deux dépôts frontend. **Écrit :** AP-26 `ready-for-dev` → `review` (mergée) · **AP-08 (8 pts) INSÉRÉE AU S6** et **AP-10 (3 pts) INSÉRÉE AU S9**, toutes deux mergées le 2026-08-09 et jusqu’ici absentes de tout sprint · S8 `in-progress` → `done` · S9 `not_started` → `in-progress` · `current_sprint` 8 → 9. **Compteurs réancrés :** +2 stories (122 → 124), +11 pts au réalisé, `done_or_review` 169 → 182, `actionable_now` 70 → 57 (AP-26 sort du reste-à-faire), `remaining` 354 → 343. **Non modifié :** la convention de statut du fichier reste `review` = livrée et mergée, en attente de revue PO ; `done` = revue PO rendue. Les stories des S1→S7 restées en `review` ne sont donc pas en retard, elles attendent une passe de recette. — Historique — 🆕 v5.5.1 — FE-INT-5 créée et slottée S10 en tête (fiche `frontend-stories/FE-INT-5.md`). Compteurs réancrés : +1 story, +2 pts. ⚠️ NON TRAITÉ ICI, à trancher au prochain planning : `current_sprint` dit encore 8 alors que le S8 est intégralement mergé et que le S9 est en cours (AP-26 en développement au 2026-08-17) — c'est la 5ᵉ fois que ce compteur retarde, exactement comme côté backend. — Historique v5.4.0 (2026-08-09) — **LE VOLET FRONTEND DU DOSSIER CLIENT EXISTE ENFIN** (demande PO : « avec les stories ajoutées côté backend, normalement il doit aussi y avoir de nouveaux tickets frontend — analyse le ticket et vois les stories frontend pour ajouter celles qui manquent »). ⚡ VÉRIFICATION FAITE AVANT D'ÉCRIRE : `grep -i dossier` sur les 106 fichiers de `frontend-stories/` rend 17 fichiers, et **AUCUN ne parle du dossier CLIENT** (tous parlent du « dossier KYC », du « dossier de justification » fiscal ou du dossier `mobile-stories/`). Le manque était total. ⚠️ ET IL ÉTAIT PRÉVISIBLE : le ticket écrit lui-même, en tête, « un volet FRONTEND (app cabinet) en découle et ne peut pas démarrer avant : il est décrit au bloc **I** pour que la portée soit lisible d'un bloc, **mais il ne se traite pas ici** ». Un bloc nommé, borné, et sans porteur — **4ᵉ occurrence en deux semaines** du défaut que ce fichier documente déjà trois fois (FE-058/STORY-145 · AP-12/STORY-149 · AP-21/STORY-175) : **une story backend livrée ne déclenche rien tant qu'une story frontend ne la nomme pas.** 📦 CE QUI EST AJOUTÉ : **FE-EPIC-008 · 11 stories · 57 pts · 3 sprints (19.1/19.2/19.3)**. § **19.1 « Le dossier existe » (18)** — FE-059 portefeuille · FE-060 assistant de création + attestation de mandat · FE-061 fiche, affectation, archivage. § **19.2 « Tout se scope sur le dossier » (18)** — FE-062 sélecteur de contexte actif · FE-063 re-scopage Atelier · FE-066 exercices. § **19.3 « Le dossier se tient dans le temps » (21)** — FE-067 re-scopage Bilan · FE-064 pièces · FE-065 axes datés par exercice · FE-068 journal + fil d'activité · FE-069 Integration Gate & e2e 🏁. 🎯 **CE QUE CE BLOC PORTE VRAIMENT, ET IL FAUT LE DIRE AVANT LES CHIFFRES** : le risque n°2 du ticket — « une trentaine d'écrans Atelier et Bilan supposent *une org = une société* ; **ils ne cassent pas : ils affichent silencieusement le mauvais dossier** ». Un scope faux qui plante se répare en une heure ; un scope faux qui rend un chiffre **plausible** se découvre sur une liasse déposée. C'est pourquoi FE-063 et FE-067 ont pour critère central un **TEST DE GARDE** (aucune URL de donnée de dossier sans `dossierId`) et non une relecture, et pourquoi FE-069 prouve l'étanchéité **sur les quatre services à la fois**. 🔢 NUMÉROTATION DÉCIMALE ASSUMÉE : ces sprints viennent après le S19 (même amont) et avant le bloc distributeur (amont backend S30→33). Les numéroter 29→31 aurait dit l'inverse de l'ordre réel ; renuméroter le bloc 20→28 est interdit par la règle du 2026-08-07. Précédent maison : le « sprint 2.5 ». ✅ RÈGLE DU 2026-08-07 TENUE : les trois sprints sont **intégralement en attente**, d'un **amont unique**. `actionable_now` reste à 141 — les dix sprints S8→S17 sans dépendance ne bougent pas d'une ligne. 📐 RÉUTILISATION VÉRIFIÉE STORY PAR STORY, PAS SUPPOSÉE : FE-040 (identité), FE-041 (OCR CFE + statuts), FE-042 (2 axes), FE-029 (exercices), FE-018/FE-022 (pièces et restitution OCR), AP-24 (patron du journal lisible) sont **AMENDÉES**, aucune n'est remplacée — c'est la même discipline que le backend a appliquée en réancrant STORY-301/302/303/304/236 au lieu de les dupliquer. ⚠️ DEUX MAQUETTES SONT DÉJÀ VALIDÉES PAR LE PO ce jour (portefeuille = `FE-D00` du prototype → **FE-059** ; assistant = `FE-D01` → **FE-060**) ; le format lettré du prototype n'est PAS repris, la v3.1.0 ayant supprimé les identifiants lettrés. **Une seule maquette reste DUE** : le fil d'activité de FE-068. ⛔ POINT DE CONTENTION À DIRE AU PLANNING : le sprint 20 BACKEND porte **165 pts pour 34 de capacité** et **76 pts de frontend en dépendent désormais** (19 déjà + 57 nouveaux). Le frontend n'a rien à arbitrer là-dessus, mais ce bloc ne se tire pas « au S19.1 » — il se tire **quand EPIC-043 tombe**. — HISTORIQUE v5.3.0 (2026-08-07) : **TOUT LE PLAN RÉORGANISÉ SUR UN SEUL CRITÈRE** (demande PO : « ce qui est déjà débloqué doit être fait vite, ce qui ne l'est pas va dans des sprints futurs »). ⚡ RÈGLE POSÉE, et c'est elle qui explique tous les mouvements : **un sprint est SOIT intégralement actionnable, SOIT intégralement en attente — jamais les deux.** Motif : une story bloquée logée dans un sprint actionnable ne se contente pas d'être en retard, elle FAUSSE LE SPRINT — elle occupe la capacité au tableau, fait paraître plein ce qui ne l'est pas, et produit à la revue un « sprint non terminé » pour une cause que personne ne contrôlait. 📊 RÉSULTAT MESURÉ : **S8→S17 = 149 pts, ZÉRO dépendance ouverte** (dix sprints à ~15 pts exécutables dans l'ordre, dès aujourd'hui) · **S18+S19 = 19 pts d'AMONT UNIQUE, le sprint 20 BACKEND** · **S20→S27 = 126 pts, amont sprints backend 30→33** · S28 différé. Avant cette révision,