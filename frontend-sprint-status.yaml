rêté) — à solder EN LIVE contre le :3007 sur une balance réellement produite par une org entitled/KYC-approuvée. ⏳ RESTE : rebase sur `dev` après le merge de FE-057, puis PR. — CADRAGE D'ORIGINE : 🆕 CRÉÉE 2026-08-06 — LA STORY MANQUAIT, et le tracker l'avait pourtant COMMANDÉE : la note de FE-027 dit mot pour mot « ⚡ À sa livraison : ouvrir une story frontend d'amendement de FE-027 ». **STORY-145 est `done` depuis le 2026-08-03** (PR balance-service#26, `POST /balances/:id/valider|rejeter`, vérifié dans `balance.controller.ts` sur origin/dev) et personne n'a ouvert la story : pendant trois jours la suite n'existait que dans la note d'une story `done`, c'est-à-dire nulle part pour le sprint-planning. C'est le MÊME défaut de chaînage qu'AP-12 (STORY-149) et AP-21 (STORY-175) — trois occurrences en une semaine. 🎯 CE N'EST PAS UN CONFORT D'ÉCRAN : c'est le 1er maillon de **FE-039** (e2e « balance→liasse→validation→export », jalon Module 1), infranchissable sans lui — `GAP-balance-validation-etat` se ferme ici. ⚠️ ORDRE : APRÈS FE-057 (elle régénère les types :3007 d'où sortent `MarquerEtatDto` et les DTO de conflit ; coder avant = écrire les types à la main, la dette exacte que FE-057 solde) et sur `balance-detail-view.tsx`, que les deux touchent. ⚠️ PIÈGE PUBLIÉ PAR LE BACKEND : le **409 a DEUX corps** en `oneOf` discriminés par `code` (`DEJA_VALIDEE` | `CONTROLES_BLOQUANTS`) — figer le rendu sur `CONTROLES_BLOQUANTS` lirait un `details.bloquants` ABSENT du refus le plus fréquent (balance déjà figée). ⚠️ Le rejet n'est PAS gardé par les contrôles (délibéré : « refuser un rejet parce que des contrôles échouent enfermerait la balance fautive ») ⇒ ne pas désactiver Rejeter quand Valider est refusé. ⚠️ `auteur` JAMAIS au corps (dérivé du seul JWT, whitelist stricte ⇒ 400). ⚠️ Validation IRRÉVERSIBLE, aucune réouverture n'existe côté backend : ne pas dessiner un bouton qui suggérerait le contraire. HORS PÉRIMÈTRE : l'interprétation des contrôles bloquants (c'est FE-053 / ST