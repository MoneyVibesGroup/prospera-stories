nverified` RESTE octroyable (absence de preuve ≠ preuve d'un défaut) ; seul `compromised` sort du sélecteur. Un seul formulaire pour octroyer ET mettre à jour (PUT idempotent, 201/200 distingués). ⚠️ 2 ÉCARTS ASSUMÉS vs AP-02 : (a) la carte ne sert plus le `lastKnown` de l'agrégat dégradé — elle est ACTIONNABLE et lit le service en direct, servir un instantané périmé laisserait octroyer sur un état qui n'existe plus ; (b) une lecture en ÉCHEC n'est pas un état vide — l'écran dit l'échec et SUSPEND l'octroi, au lieu de dire « aucun droit » sur une ignorance. PREUVES : 185 tests / 29 fichiers (39 pour la feature), tsc 0, eslint 0, prettier propre, build OK. — HISTORIQUE : ✅ DÉBLOQUÉE 2026-07-28 — ANNULE ET REMPLACE la requalification `blocked (backend)` posée LE MÊME JOUR, qui ÉTAIT FAUSSE. Le motif invoqué (« le BFF ne proxifie aucune lecture d'entitlement ») était exact mais SANS PORTÉE : ce front ne passe pas par le BFF. Vérifié dans frontend-admin-panel/src/lib/api/services.ts — routage DIRECT-PAR-SERVICE (gateway option B, FE-INT-0) : le préfixe /catalog résout vers NEXT_PUBLIC_CATALOG_URL avec strip:false, donc /catalog/entitlements/:orgId part sur {CATALOG}/api/v1/catalog/entitlements/:orgId. Et les 4 routes EXISTENT — vérifié sur origin/dev de prospera-platform-catalog-service, entitlements.controller.ts, @Controller(catalog/entitlements) : PUT :orgId/:moduleCode (@RequirePermissions ENTITLEMENT_GRANT, idempotent 201/200) · DELETE :orgId/:moduleCode (ENTITLEMENT_REVOKE) · GET :orgId (réconciliation, autorisation CONTEXTUELLE assertCanReadOrg → org:read côté plateforme) · GET :orgId/:moduleCode. ⚡ STORY-143 N'EST PAS une dépendance d'AP-05 : elle ajoute un pass-through au BFF, que ce front n'emprunte pas. 🪤 LEÇON — l'erreur ne vient pas d'une mauvaise lecture du BACKEND (celle-là était juste) mais d'avoir PRÉSUMÉ L'ARCHITECTURE DU FRONT au lieu de l'ouvrir. Avant de déclarer une story frontend bloquée par une route manquante, LIRE src/lib/api/services.ts du front concerné. C'est la même famille de piège que ce fichier documente déjà deux fois, appliquée cette fois au front. ⚠️ Vigilance d'implémentation : un référentiel au checksum non conforme n'est PAS octroyable (AP-04 isReferentielUsable) — l'exclure du sélecteur, sinon l'échec se produit chez le client au chargement du paquet, loin d'ici." }
