    etat_reel: "⚡ MAQUETTE, pas une app en attente d'intégration. Vérifié le 2026-08-02 : 25 écrans, 0 `fetch(`, 0 `axios`/`apiClient`, 0 `useQuery`, 0 `NEXT_PUBLIC_*_URL` ; les données viennent de `lib/generators/mock-seed.ts` et `generate-*.ts`. L'app cabinet a un client API, des types générés et un Integration Gate ; celle-ci n'a aucun des trois. La différence n'est pas de maturité, elle est de NATURE."
