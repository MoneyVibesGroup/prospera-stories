  note: "⚡ ÉTAT RÉEL 2026-08-07 — **LE PLAN NE CONTIENT PLUS AUCUN SPRINT MIXTE.** Après réorganisation : dix sprints d'affilée (S8→S17) à ~15 pts, **149 points sans une seule dépendance ouverte**, puis dix sprints d'attente rangés par amont. À 15-18 pts/sprint et 2 semaines de sprint, cela représente **environ dix mois de travail frontend que rien ne peut bloquer** — le backend n'est plus, et ne sera plus avant longtemps, le facteur limitant. ⚠️ CE QUE CE CHIFFRE NE DIT PAS, ET QU'IL FAUT DIRE AU PLANNING : la capacité est d'UN dev pour SIX surfaces (cabinet, console, distributeur, page publique, terrain, e2e inter-apps). Le risque du programme n'est plus la disponibilité des API, c'est la capacité — et aucune réorganisation de tracker ne le traitera. ⚡ LE SEUL VRAI POINT DE VIGILANCE DE SÉQUENCEMENT : les 19 pts des S18/S19 attendent le **sprint 20 BACKEND**, qui porte 188 % de sa capacité (64 engagés / 34) ET tout le reste de la dette console. Si ce sprint glisse, ce sont deux sprints frontend qui glissent — mais AUCUN des dix premiers. — HISTORIQUE : ⚡ ÉTAT RÉEL 2026-08-06 — LE FRONTEND EST LE CHEMIN CRITIQUE, ET LE BACKEND A PRIS ENCORE DE L'AVANCE. Depuis le 08-01, le backend a soldé son sprint 19 (37/37, dont l'EPIC-023 MOTEUR FISCAL COMPLET) et livré 10 stories que ce tracker ne connaissait pas. Conséquence : **147 pts frontend sont actionnables sans aucune dépendance ouverte, soit dix sprints d'affilée à ~15-18 pts** — et le S17 (moteur fiscal), qui était « le premier sprint réellement bloqué », ne l'est plus. Il ne reste que 19 pts bloqués sur S8→S18, tous suspendus au MÊME sprint backend (le S20, chargé à 188 %). ⚠️ CE QUI A RÉELLEMENT COÛTÉ, ET QUI N'EST PAS UN PROBLÈME DE CAPACITÉ : **23 pts de travail frontend déjà mergés étaient comptés comme à faire**, et trois stories backend livrées (145, 149, 175 en attente) n'avaient AUCUNE story frontend pour les consommer. Le goulot du programme n'est ni le backend ni le dev — c'est le DÉLAI DE RÉANCRAGE entre une livraison et le tracker qui la nomme. Un `git log` par dépôt le referme en dix minutes ; six jours sans, et deux sprints deviennent faux. — HISTORIQUE : ⚡ ÉTAT RÉEL 2026-07-31 — LE FRONTEND NE TRAILE PLUS LE BACKEND, IL EST DEVENU LE CHEMIN CRITIQUE. Le backend a clôturé ses sprints 15, 16, 17 et 18 : tout ce que le frontend attendait jusqu'au S13 frontend est livré. Il reste 93 pts de travail CLIENT immédiatement actionnables (Bilan complet + Atelier EXTENDED) et 53 pts ADMIN dont 48 sont verrouillés par les 5 pts d'AP-01 — le dépôt admin-panel n'est qu'un BFF NestJS, aucune UI n'existe. ⚠️ CONSÉQUENCE DE PLANIFICATION : les DEUX démos de boucle qui structurent le plan (S4 KYC bout-en-bout, S5 entitlement) restent indémontrables non par manque de backend mais par absence de console — c'est le meilleur rapport déblocage/effort du programme. Seuls vrais blocages backend restants : FE-050→054 (moteur fiscal 091→098/100, backend S19/S20) et FE-011/012/013 (paiement, backend S21). — HISTORIQUE : Capacité partagée 1 dev entre app cliente et admin-panel. ⚡ v3.0.0 : l'entrelacement n'est plus « un sprint admin puis un sprint client » mais des TRANCHES VERTICALES (S3 contrat partagé, S4 boucle KYC, S5 boucle entitlement, S6 admin v1 🏁), puis S7 Atelier CORE, S8→S10 Bilan, S11→S15 Atelier EXTENDED, S16 paiement. Le frontend TRAILE le backend : aucune story ne démarre avant son backend_ready. ÉTAT RÉEL 2026-07-17 : le backend a livré jusqu'au sprint 10 (29/34, reliquat STORY-106) ⇒ 71 pts sont actionnables IMMÉDIATEMENT (S3=17, S4=18, S5=18, S6=18 dont AP-08 en pari sur 106). Rien n'est en attente de backend avant le S7 (Atelier CORE, backend S11). ⚠️ capacity_per_sprint: 34 est la capacité THÉORIQUE — la cible réaliste est ~18/sprint (1 dev), et c'est elle qui a servi au découpage."

