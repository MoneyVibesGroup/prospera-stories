  - sprint_number: 11
    name: "⏳ Tout se rattache au dossier — l'Atelier livré cesse de parler au cabinet, et l'identité de la société arrive"
    status: "not_started"
    committed_points: 41
    goal: "⚠️ LE SPRINT LE PLUS RISQUÉ DU BLOC, ET LE MOINS SPECTACULAIRE. Il ne livre presque aucun écran neuf : il fait en sorte que les ~26 écrans Atelier DÉJÀ LIVRÉS cessent de parler au cabinet et parlent au DOSSIER, et il pose le shell du Bilan DÉJÀ dossier-scopé — de sorte que les 9 écrans du Bilan qui suivent naissent justes. Puis l'identité fiscale de la société (profil, OCR, 2 axes) se pose au bon endroit, c'est-à-dire APRÈS que `profil-societe` a migré vers `dossier-service`. ⚡ SI CE SPRINT EST FAIT DANS LE DÉSORDRE, TOUT CE QUI SUIT EST À REFAIRE."
    backend_dependency: "⚠️ **RÉANCRÉ LE 2026-08-19 (par FE-063) — L'AMONT N'EST PLUS UNIQUE, ET CE SPRINT EST DEVENU MIXTE.** `git log origin/dev` + `sprint-status.yaml` backend, vérifiés ce jour : **STORY-356 et STORY-236 sont MERGÉES** (`9b3a7b4`, `c8abecd`) — les cinq autres (357, 358, 359, 360, 303) sont **toujours `not_started`**. ⇒ État réel des 12 stories : **FE-063 LIVRÉE** · **FE-047 et FE-048 ACTIONNABLES** (leur seul verrou était FE-063) · **FE-028/059b/064/065/068/071 bloquées sur un amont BACKEND non démarré** · **FE-040/041/042 bloquées sur une DÉCISION PO**, pas sur du code — l'ordre « après FE-063 » supposait la migration de `profil-societe`, que STORY-236 exclut explicitement (voir la note de FE-040). ⛔ **CE SPRINT VIOLE DONC LA RÈGLE PO « un sprint est soit intégralement actionnable, soit intégralement en attente ».** Le constat est posé ici plutôt que corrigé unilatéralement : regrouper le bloqué par amont, ou dissoudre le sprint, est un **arbitrage PO** — et renuméroter est interdit. **3 décisions sont dues avant d'ouvrir la suite** : (1) `profil-societe` — `dossier-service` porte-t-il l'identité fiscale (il porte déjà pays, type d'entité et les 2 axes) ou crée-t-on une story backend de migration ? (2) `profils_import` — réutilisable par organisation ou propre au dossier (STORY-236 : « à confirmer avec le PO ») ? (3) `tresorerie` — absente du §4.2 du ticket alors qu'elle porte de la donnée de dossier au même titre que les cahiers (STORY-236 : « point à trancher avec le PO avant dev-story »), ce qui conditionne **FE-049**. — Contexte d'origine — ⏳ **AMONT UNIQUE — le reliquat EPIC-043 du sprint 20 BACKEND, `in_progress`.** Ordre backend annoncé : STORY-356 (migration `dossierId`) → 236 (le contrat de balance canonique porte le `dossierId`) → 357 (re-scopage bilan) → 358 (pièces) → 303 (axes datés) → 359 (ligne consolidée) → 360 (journal). LES SEPT sont `not_started` au 2026-08-14 et doivent tomber PENDANT LE S10. ⚡ C'EST LE SEUL POINT DE RUPTURE DU PLAN. Plausible : le backend a mergé 6 stories EPIC-043 en deux jours (13 et 14/08). Si elles glissent, **ce sprint glisse EN BLOC** — la règle du 2026-08-07 l'exige, et c'est préférable à un sprint à moitié faux. ⚠️ STORY-355 précise que les read-models de balance/bilan sont posés mais que « rien ne les lit encore — c'est délibéré : la projection doit converger AVANT que STORY-236 et STORY-357 en dépendent »."
    stories:
      - { id: "FE-063", app: "client", title: "Re-scopage de l'Atelier sur le dossier — les 5 familles RÉELLEMENT appelées par le front (⚠️ PAS 15 : les 10 autres n'ont pas encore d'écran)", epic: "FE-EPIC-008", points: 8, status: "review", backend_ready: "done", backend_ref: "STORY-236,356", note: "✅ **LIVRÉE le 2026-08-19** — branche `fe-063`, partie de `origin/dev` APRÈS le merge de FE-062 (`2fcf123`). 🔓 **DÉBLOQUÉE : STORY-236 et STORY-356 sont MERGÉES** (`c8abecd`, `9b3a7b4` sur `balance-service`, `5d6489d` sur `dossier-service`) — le tracker les disait `not_started`, la fiche les disait `done` depuis le 18/08 sans que la ligne de sprint soit reprise. ⚡ **VÉRIFIÉ SUR L'OpenAPI VIVANT de `:3007`, pas sur la fiche** : 78 chemins, dont **65 sous `/dossiers/{dossierId}/…`**. ⛔ **ÉCART Nº1 — LE PÉRIMÈTRE ANNONCÉ ÉTAIT FAUX DE 10 FAMILLES SUR 15, ET DANS LE SENS QUI RASSURE.** La fiche listait `cahiers/*`, `fiscal/*` (7 contrôleurs), `rapprochement`, `pieces/ocr`, `rattachement`, `imports` — **le backend les sert, mais AUCUN écran ne les appelle** : ce sont FE-043→050, sprint 12. Le front n'avait que **7 modules d'API**, dont 5 à re-scoper (`get-balance`, `list-balances`, `submit-balance`, `marquer-etat`, `import-sage` — exactement les 5 routes mortes inventoriées par FE-INT-5) et 2 à NE PAS toucher. ⇒ Le travail réel n'est pas volumétrique, il est **structurel** : la garde. ⛔ **ÉCART Nº2, ET IL DÉBORDE SUR TROIS AUTRES STORIES — `profil-societe` N'A PAS MIGRÉ, ET NE MIGRERA PAS PAR CETTE VOIE.** L'AC-6 de la fiche exige que FE-040/041/042 pointent vers `dossier-service` ; or **STORY-236 place explicitement `profil-societe` HORS PÉRIMÈTRE** (§« Hors périmètre », mot pour mot : le module « semble déjà superflu », sa dépréciation est « un sujet séparé, à trancher avec le PO »). Vérifié dans le code : `dossier-service` n'a que 2 contrôleurs (`dossiers`, `exercices`), et `balance-service` sert toujours `/profil-societe` **org-keyed, sans segment de dossier**. ⇒ **AC-6 est SANS OBJET pour cette story** (vérifié par `grep` : zéro appel `profil-societe` dans le front — il n'y a aucun écran à migrer) **et l'ordre « FE-040/041/042 après FE-063 » ne repose plus sur rien** : voir les notes corrigées de ces trois stories, et l'arbitrage PO ouvert ci-dessous. ⚡ **CE QUI EST RÉELLEMENT LIVRÉ, ET POURQUOI CE N'EST PAS LA RÉGÉNÉRATION DES TYPES** : `npm run gen:api -- balance` rend un **diff VIDE** — `src/types/api/balance.ts` portait déjà les 65 chemins depuis FE-INT-5. L'AC-3 était donc déjà satisfaite sur `dev`, et croire que la story consistait à régénérer aurait produit une PR vide et un Atelier toujours mort. **Deuxième occurrence de la leçon FE-070 : la régénération n'est jamais le livrable, la GARDE l'est.** Le livrable est `api/paths.ts` (constructeur unique + allowlist fermée des 2 routes d'organisation) et sa garde `scope-dossier.guard.test.ts`, qui LIT LES SOURCES et rougit sur un fichier **qui n'existe pas encore** — c'est-à-dire sur les 10 familles du sprint 12. ⚠️ **PIÈGE TROUVÉ EN ÉCRIVANT LA GARDE, ET IL EST DANS LE DÉPÔT, PAS DANS LE TEST : `/atelier` est À LA FOIS le préfixe logique de `balance-service` ET l'espace de routes de l'app** (`src/app/(app)/atelier/…`). Une garde qui cherche `/atelier` attrape 11 `href` de pages parfaitement légitimes ; on ne peut pas lui concéder d'exceptions sans la désarmer. Elle vise donc le **premier argument littéral de `apiFetch`/`uploadMultipart`**, sur tout `src/`. ⚠️ **`BalanceResponseDto` NE PORTE PAS DE `dossierId`** (vérifié sur l'OpenAPI réel) : le front ne peut PAS recouper après coup le dossier d'une balance reçue — **la seule chose qui rattache une réponse à un dossier est l'URL qui l'a demandée**. C'est ce qui fait de la construction d'URL le point de contrôle, et c'est pourquoi la garde est structurelle et non un contrôle de cohérence. ⇒ ticket backend ouvert. ⛔ **PIÈGE E2E QUE CETTE STORY A OUVERT ET REFERMÉ : le stub de `dossier-service` avalait les appels de `balance-service`.** `stubDossierService` interceptait `**/api/v1/dossiers**` — un motif de CHEMIN, sans origine — sans risque tant qu'un seul service exposait `/dossiers`. Depuis STORY-236, `:3007` sert TOUTE la surface de l'Atelier sous ce même chemin : le stub aurait répondu **une liste de dossiers à une demande de balances**, en `200`, avec un JSON valide. Le mode de panne de la story, reproduit dans son propre outillage. ⇒ stubs **ancrés sur l'ORIGINE** (`routeBalance()`), et les 5 specs Atelier repointées. ⚠️ **`referentiels/actifs` et `balances/suggest-comptes` restent org-keyed** (nuance D5, vérifié sur l'OpenAPI : pas de segment `{dossierId}`) — les scoper rendrait 404, et pour `referentiels/actifs`, qui est la **sonde du gate**, ce 404 fermerait le module entier. Une contre-épreuve les verrouille : la garde pousse dans les DEUX sens. ⚠️ Le `dossierId` **n'entre pas dans le checksum** (vérifié sur `balance.checksum.ts` : le sceau ne couvre que le contenu métier) — l'y ajouter « par cohérence » ferait refuser en 400 **toute** saisie directe. ✅ **GATES : `typecheck` · `lint` (0 warning) · `build` verts, et la suite unitaire COMPLÈTE à 588/588 sur 86 fichiers** — FE-062 en comptait 565, soit **+23 et AUCUN test supprimé** (AC-7 tenue : les tests d'URL ont été ÉTENDUS — dossier, encodage des deux segments, refus sans dossier — jamais remplacés). ⚠️ Suite **sérialisée** (`--no-file-parallelism`) : en parallèle les workers Vitest échouent au démarrage sur ce poste, et le casting des rouges change d'une exécution à l'autre — **c'est de la contention, pas une régression**, comme documenté à FE-070. ⚠️ L'idempotence de balance est désormais bornée **au dossier** (index d'unicité migré d'`orgId` à `dossierId`) : deux dossiers peuvent porter la même version du même exercice — le cas normal d'un cabinet. — Contexte d'origine — ⚡ **PREMIÈRE DU SPRINT, ET PREMIÈRE DE TOUT CE QUI RESTE À ÉCRIRE.** Tant qu'elle n'est pas faite, chaque écran Atelier ou EXTENDED écrit ailleurs devra être réécrit. ⚠️ C'est le RISQUE Nº2 du ticket, littéralement : « les écrans affichent silencieusement le mauvais dossier » — un défaut qui ne lève AUCUNE erreur." }
      - { id: "FE-028", app: "client", title: "Module Bilan : shell, navigation, gate `@RequiresBilanAccess` (entitlement + KYC) + sélection de la balance source — **DOSSIER-SCOPÉ DÈS LA PREMIÈRE LIGNE**", epic: "FE-EPIC-005", points: 3, status: "blocked", backend_ready: "not_started", backend_ref: "STORY-035,037,357", note: "🔄 **RE-SPÉCIFIÉE le 2026-08-14, ET DÉPLACÉE DU S10 AU S11.** Son contenu d'origine (shell + gate + choix de la balance source) est INCHANGÉ ; ce qui change est la clé : `dossierId`, pas `orgId`. ⚡ **C'EST CE DÉPLACEMENT QUI SUPPRIME FE-067** (5 pts rendus) — « re-scopage du Bilan sur le dossier, les 10 familles » n'a plus d'objet si le Bilan naît scopé. ⚠️ Le gate reste au niveau ORGANISATION (entitlement + KYC sont des propriétés du cabinet, pas du dossier) : ne pas le déplacer sur le dossier par symétrie — la sélection de la balance source, elle, est bien dossier-scopée." }
      - { id: "FE-059b", app: "client", title: "Le portefeuille compte juste — 3 compteurs servis, pagination serveur, prochaine échéance, onglet Archivés", epic: "FE-EPIC-008", points: 2, status: "blocked", backend_ready: "not_started", backend_ref: "STORY-359", note: "🔀 **SECONDE MOITIÉ DE FE-059, scindée le 2026-08-14.** ⚠️ **PIÈGE CENTRAL, ET IL EST DANS LA MAQUETTE : les 3 compteurs doivent venir du SERVEUR, jamais d'un recalcul sur la page courante** — « un collaborateur qui lirait 5 dossiers alors qu'il n'en voit que 2 conclurait qu'on lui en cache ». C'est précisément pour ça que cette moitié attend STORY-359 au lieu d'être bricolée côté client. ⚠️ La prochaine échéance existe dans le paquet fiscal mais AUCUNE ROUTE NE LA SERT (bloc P du ticket) — elle vient avec 359. ⚠️ `GET /dossiers` exclut les archivés (lisibles à l'unité seulement) : l'onglet Archivés a besoin de sa propre liste." }
      - { id: "FE-071", app: "client", title: "Filtre « Mes dossiers » au portefeuille — servi par le backend, jamais recalculé sur la page courante", epic: "FE-EPIC-008", points: 2, status: "blocked", backend_ready: "not_started", backend_ref: "TICKET-BACKEND-filtre-mes-dossiers-au-portefeuille,STORY-359", note: "🆕 CRÉÉE le 2026-08-18 PAR FE-059a, qui a livré le portefeuille SANS le sélecteur de la maquette FE-D00 et l'a écrit dans le code plutôt que de le simuler. ⛔ BLOQUÉE DEUX FOIS : le ticket backend est OUVERT **et** il demande un ARBITRAGE PO (Q1 maintenir ou retirer le sélecteur · Q2 responsable seul ou responsable + contributeur · Q3 survie au rechargement). ⚡ CE N'EST PAS UN MANQUE DE PORTÉE — le bloc K du ticket dossier verrouille « portée dérivée du jeton, jamais un paramètre de requête », et D11 garde « Mon cabinet » invisible d'un collaborateur ; ce filtre est ORTHOGONAL, il agit À L'INTÉRIEUR de ce que le jeton autorise déjà et ne peut RIEN révéler. ⚠️ ET IL NE PEUT PAS SE FAIRE CÔTÉ CLIENT : D16 impose la pagination serveur (STORY-359) ⇒ un filtre local ne porterait que sur LA PAGE COURANTE (un admin responsable de 12 dossiers en verrait 3 sur la page 1) — MOT POUR MOT le défaut que la maquette proscrit pour les compteurs, et la raison d'être de la scission FE-059a/b. ⚠️ À TIRER AVEC FE-059b : même route, même livraison backend, même piège. ⚠️ Si Q1 tranche « on retire le sélecteur », cette story se ferme SANS CODE — issue légitime, pas un échec." }
      - { id: "FE-064", app: "client", title: "Les pièces du dossier — statuts, carte CFE et lettre de mission cessent de disparaître après l'OCR", epic: "FE-EPIC-008", points: 3, status: "ready-for-dev", backend_ready: "done", backend_ref: "STORY-358", note: "🔓 **DÉBLOQUÉE LE 2026-08-19 — STORY-358 EST LIVRÉE** (PR `prospera-ocr-service#11` + `prospera-balance-service#43` rebase-mergées ENSEMBLE, contrat d'événement = 2 dépôts). Servi et **vérifié sur l'OpenAPI vivant de `:3006`** : `GET /dossiers/{dossierId}/pieces` + `dossierId` **facultatif** au dépôt sur les 2 familles d'extraction. ⚠️ **CE QUE FE-060 LAISSE EXACTEMENT** : elle dépose les pièces pour l'OCR **sans `dossierId`** — et pour cause, le dossier n'existe pas encore quand on dépose. Les **rattacher après création** est le travail de CETTE story. ⚠️ Vérifier l'URL présignée dans un VRAI NAVIGATEUR, pas au curl (leçon FE-023 → STORY-179 → STORY-352). — Contexte d'origine — ⚠️ Rattachement ADDITIF : `dossierId` est OPTIONNEL côté contrat, **parce que les pièces KYC du cabinet n'appartiennent à aucun dossier et ne doivent pas être forcées d'en avoir un**. Ne pas rendre le champ obligatoire côté client « pour faire propre » : ça casserait le KYC du cabinet lui-même." }
      - { id: "FE-065", app: "client", title: "Les 2 axes datés par exercice — un changement vaut à partir de l'exercice ouvert, jamais rétroactivement", epic: "FE-EPIC-008", points: 3, status: "ready-for-dev", backend_ready: "done", backend_ref: "STORY-303", note: "⚡ **RENFORCÉE PAR FE-060 (2026-08-19) — LES 2 AXES N'ONT AUCUNE SURFACE D'ÉCRITURE AUJOURD'HUI.** L'étape 3 de la maquette FE-D01 les proposait ; `CreerDossierDto` ne les expose pas, et la preuve a été faite EN LIVE : `400 « property systemeComptable should not exist »`. L'assistant ne les demande donc pas, et **l'AC-6 de FE-060 est devenu SANS OBJET** — il n'y a aucun axe à faire diverger tant que cette story n'est pas livrée. ⇒ **c'est ICI que la règle « un axe divergent exige un motif » atterrit.** — ⚠️ Bloc M du ticket : le régime n'est pas daté aujourd'hui. Un changement de régime rétroactif réécrirait des liasses déjà validées — l'immutabilité de FE-034 en dépend. ⚠️ L'écran doit rendre VISIBLE la date d'effet, pas seulement la valeur courante. ── 🔓 **DÉBLOQUÉE LE 2026-08-19 : STORY-303 est `done`** (PR prospera-dossier-service#8 + prospera-balance-service#44 rebase-mergées ensemble sur `dev`). ⚠️ **QUATRE ÉCARTS ENTRE CETTE FICHE ET L'OPENAPI VIVANT — à confronter AVANT d'en coder une ligne (règle ① de FE-060)** : (1) la lecture est `GET /api/v1/dossiers/{id}/axes?exerciceId=<ObjectId>` et NON `?exercice=` — le paramètre est l'identifiant de l'exercice, pas une année, et un `?exercice=2026` rend **400** (whitelist stricte) ; la réponse porte `effectifs.decision`, `effectifs.herite` (AC-1/AC-3 : dire que les axes viennent d'un exercice ANTÉRIEUR), `effectifs.exercice` et `historique[]` ; (2) l'écriture `POST /api/v1/dossiers/{id}/axes` rend **200** (jamais 201) — un couple identique à celui en vigueur est un NO-OP qui rend la décision existante ; (3) ⚡ **le MOTIF est exigé sur TOUT changement du couple en vigueur**, pas seulement sur une divergence de la proposition (`400 MOTIF_AXES_REQUIS`) : `dossier-service` ne peut pas recalculer la proposition — elle exige le CA d'une balance et les seuils du paquet fiscal, propriété de `balance-service` — et croire un drapeau `divergent` envoyé par le client rouvrirait le contournement que STORY-080 avait fermé. L'écran doit donc demander un motif dès que l'utilisateur change un axe. La PROPOSITION reste servie par `GET /api/v1/dossiers/{id}/profil-societe/regime` (balance-service) ; (4) deux refus à câbler, tous deux porteurs de leur remède : `400 EFFET_A_DATER_RETROACTIF` (la date d'effet précède le début de l'exercice ouvert, dont le message NOMME) et `409 DECISION_POSTERIEURE_EXISTANTE` (reposter le couple courant alors qu'une bascule est déjà programmée : le corps porte `details.effetADater`, la date à viser pour la remplacer). Aussi : `409 AUCUN_EXERCICE_OUVERT` — il faut un exercice ouvert pour décider. ⛔ **`GET /dossiers/{id}` NE PUBLIE PLUS `systemeComptable`/`regimeFiscal`** (retirés en revue) : deux routes du même service annonçaient deux couples différents du même dossier. Les axes ont désormais UNE seule source, `GET /dossiers/{id}/axes`." }
