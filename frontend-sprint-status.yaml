    backend_dependency: "⚠️ **UNE DÉPENDANCE EST APPARUE LE 2026-08-15, APRÈS LA CONSTRUCTION DE CE SPRINT : STORY-363.** L'arbitrage PO sur AD-8 de la spine `dossier-service` décide que le service exigera **`emailVerified` + KYC `APPROVED`** (pas d'entitlement). Le gate **n'existe pas dans le code** — le service ne consomme même pas `kyc.status.changed`. ⇒ **STORY-363 doit être livrée AVANT ou AVEC ce sprint** : livrée après, elle casse des écrans qui marchaient (motif exact d'AP-26, où `If-Match` durci sans son client a rendu `428` sur toutes les décisions KYC pendant une semaine). ⚠️ CONSÉQUENCE DIRECTE SUR CES 5 STORIES : le semis de développement et l'e2e **FE-069** doivent **approuver le KYC AVANT d'ouvrir un dossier**, sinon tout le parcours rend `KYC_NOT_APPROVED`. ⚠️ « Mon cabinet » reste auto-créé hors gate (D1) — ne pas conclure d'un portefeuille non vide que le KYC est approuvé. — État initial du sprint : ✅ vérifié le 2026-08-14 sur `origin/dev` de `prospera-dossier-service` : STORY-301 (socle, modèle, création, mandat, « Mon cabinet »), STORY-353 (portée du portefeuille), STORY-354 (unicité du NIF), STORY-304 (résolution type d'entité → référentiel ET paquet fiscal), STORY-302 (type d'entité + pays), STORY-355 (l'exercice appartient au dossier) — les SIX sont `done` (13 et 14/08). Routes servies et lues dans le code : `GET|POST /dossiers`, `GET /dossiers/:id`, `PATCH /:id/affectation`, `POST /:id/archiver|reactiver`, `GET|POST /dossiers/:dossierId/exercices`, `POST …/:exId/clore|rouvrir`. AP-19 : STORY-186 `done` (12/08). AP-11 : STORY-140/141/143 `done`."
    stories:
      - { id: "FE-INT-5", app: "client", title: "Le front atteint `dossier-service` — préfixe logique `/dossiers`, base :3009, types générés (amende FE-INT-0)", epic: "FE-EPIC-002", points: 2, status: "review", backend_ready: "done", backend_ref: "STORY-301,353,354,304,302,355,356", note: "✅ **MERGÉE dans `origin/dev` le 2026-08-18** (`886968e`). *(Réancrage FE-063 du 2026-08-19 : la fiche disait encore « PR à ouvrir ».)* 🆕 CRÉÉE le 2026-08-17. ⚡ **PREMIÈRE DU SPRINT, ET DÉPENDANCE DURE DES CINQ AUTRES** — sans elle le bloc dossier s'ouvre sur un `resolveApiUrl()` qui lève. **5ᵉ occurrence du défaut de chaînage, dans une forme NOUVELLE** : les 4 précédentes étaient « une story backend livrée ne déclenche rien tant qu'une story frontend ne la nomme pas » ; ici HUIT stories backend sont livrées, le service a 12 routes, il est **déclaré dans le `docker-compose.yml` racine avec son CORS et son port publié** — et le front ne sait pas qu'il existe. ⇒ RÈGLE À L'OUVERTURE DE TOUT BLOC S'APPUYANT SUR UN SERVICE NEUF : `grep` son nom dans le compose ET dans `services.ts` ET dans `gen-api.mjs` ; « le service est dans le compose » ne dit rien de ce que le FRONT en sait. ✅ INFRA VÉRIFIÉE EN CONDITIONS NAVIGATEUR le 2026-08-17 (le dev ne rejoue pas ces contrôles) : health mongo+kafka `up` · 12 routes montées · `GET /dossiers` sans jeton = **401** et `/inexistant` = **404** (le 401 n'est donc pas un fourre-tout) · **préflight `OPTIONS` + `Origin: localhost:3100` = 204 avec `Access-Control-Allow-Origin`**, et une origine non autorisée ne reçoit PAS l'en-tête (allowlist réelle, jamais `*`) · `/api/docs-json` = 200 · **10 dossiers « Mon cabinet » déjà créés** par rejeu de `identity.org.created` ⇒ FE-059a ne testera pas sur une liste vide. ⚡ Le piège de FE-057 est désamorcé AVANT le premier écran, pour la 1ʳᵉ fois du programme. ⛔ **PIÈGE PRINCIPAL, ET IL EST LE VRAI CONTENU DE LA STORY : `gen:api` VA RESTER VERT EN CACHANT QUE L'ATELIER EST MORT.** STORY-236 (16/08) a déplacé toute la surface de `balance-service` sous `dossiers/:dossierId/…` ⇒ **5 des 7 fichiers `features/atelier/api/` appellent des routes 404** (get-balance, list-balances, submit-balance, marquer-etat — soit FE-058 mergée le 08/08 — et import-sage ; seuls `referentiels/actifs` et `suggest-comptes` survivent). Et RIEN ne le signalera : vérifié, le front dérive ses types de `components[\"schemas\"]` **exclusivement**, jamais de `paths[…]` ; les noms de DTO sont INCHANGÉS par 236, seules les clés de chemin ont bougé, et `apiFetch<T>(path: string)` prend une chaîne libre ⇒ **gen:api vert · tsc vert · lint vert · build vert · 5 appels morts**. Symétrique exact du « commentaire d'écart périmé » de FE-017. ⇒ CETTE STORY NE RÉPARE RIEN : elle **transmet** le tableau des 5 routes mortes, produit par appel réel, comme livrable d'entrée de **FE-063**. ⚠️ EN REVUE : une PR FE-INT-5 toute verte NE PROUVE PAS que l'Atelier fonctionne. ⚠️ `strip: false` (contrairement à `/ec` et `/atelier`) — le service expose VRAIMENT ses routes sous `/dossiers` ; `strip: true` par symétrie enverrait `/api/v1/` nu. ⚠️ `optional()` ici comme CATALOG/DOCUMENT/BALANCE, **mais FE-062 doit la promouvoir en requis** : dès que le sélecteur de dossier est dans le shell, l'app sans cette variable ne s'ouvre plus." }
      - { id: "FE-059a", app: "client", title: "Portefeuille de dossiers clients — liste dense + cartes, recherche/tri, portée par rôle, archivés à l'unité", epic: "FE-EPIC-008", points: 3, status: "review", backend_ready: "done", backend_ref: "STORY-301,353", note: "✅ **MERGÉE dans `origin/dev` le 2026-08-18** (`a2b19e4`). *(Réancrage FE-063 du 2026-08-19 : la fiche disait encore « PR à ouvrir ».)* 🔀 **SCINDÉE le 2026-08-14 (décision PO) — FE-059 valait 5 pts et n'était servable qu'à moitié.** `GET /dossiers` déclare LUI-MÊME dans son `@ApiOperation` : « Pagination et compteurs : STORY-359 », et exclut les archivés de la liste. Ce qui EST servi et part ici : la liste, les cartes, la recherche/tri, et surtout **LA PORTÉE** — `TENANT_ADMIN` voit tout le portefeuille (« Mon cabinet » compris), `TENANT_USER` uniquement ses affectations, et « Mon cabinet » lui est INVISIBLE (D11). ⚡ RACINE DU BLOC : ni FE-060 ni FE-062 n'ont d'où partir sans elle. ⚠️ Maquette VALIDÉE PAR LE PO (`FE-D00`). ⚠️ D16 impose la vue liste dense + pagination (cible NFR : 500 dossiers) : la grille de cartes ne tient pas au-delà de quelques dizaines. ⚠️ **`dossier-service` est NEUF ⇒ sa variable CORS doit lister l'origine `:3100`, et ça ne se voit QU'EN NAVIGATEUR** — un préflight n'existe pas en serveur-à-serveur. C'est exactement le trou trouvé sur `balance-service` au FE-057, et il fermait tout l'Atelier sur un `200`." }
      - { id: "FE-062", app: "client", title: "Le dossier actif — sélecteur de contexte dans le shell, `dossierId` dans l'URL, purge du cache au basculement", epic: "FE-EPIC-008", points: 5, status: "review", backend_ready: "done", backend_ref: "STORY-301,353", note: "✅ **MERGÉE dans `origin/dev` le 2026-08-18** (`2fcf123`). ⚡ **SON INTEGRATION GATE, LAISSÉ OUVERT, A ÉTÉ HONORÉ PAR FE-063 le 2026-08-19** — voir ci-dessous : la bascule A→B est désormais prouvée PAR LES CHIFFRES (deux dossiers portant des balances réellement différentes, assertions négatives + inspection du réseau), ce qui était structurellement impossible tant que les appels ne portaient pas le `dossierId`. — Historique de livraison — branche `fe-062` (`887c0b5`), **REBASÉE SUR `origin/dev` et poussée** : FE-INT-5 et FE-059a ayant été fusionnées entre-temps, git a droppé leurs commits (« already upstream ») ⇒ **un commit unique au-dessus de `dev`, sans doublon**. FE-061 n'était PAS un pré-requis réel : elle enrichit la fiche du dossier, FE-059a l'avait déjà créée. ⚡ **LE REBASE A TROUVÉ UN E2E ROUGE QUE LES GATES NE POUVAIENT PAS VOIR** : `dev` avait aussi reçu **FE-070**, qui ajoute un test à `e2e/atelier-saisie.spec.ts` — un fichier que cette story modifie. **Fusion sans conflit**, et le test neuf naviguait vers `/atelier/saisie` SANS dossier ⇒ la garde de scope l'aurait renvoyé au portefeuille, rouge en CI. ⇒ **RÈGLE : un rebase propre ≠ un rebase sans dégât — après tout rebase, `grep` les invariants que la story vient d'introduire dans les fichiers qu'upstream a touchés.** Gates REJOUÉS après rebase : typecheck · lint · build verts, **565 unitaires** (sérialisés) et **103 E2E**. ⛔ **INTEGRATION GATE LAISSÉ OUVERT, ET C'EST LE POINT LE PLUS IMPORTANT DE CETTE LIVRAISON** : la DoD exige de prouver la bascule « par les CHIFFRES » sur deux dossiers portant des balances différentes — **impossible avant FE-063**, parce que les appels de l'Atelier ne portent pas encore le `dossierId` (STORY-236 a déplacé la surface de `balance-service` sous `/dossiers/:dossierId/…`). Le serveur rend donc LA MÊME réponse pour A et pour B : un gate vert n'aurait prouvé que la capacité du fixture à mentir. La donnée de dossier réellement assertée en navigateur est l'**exercice** (`GET /dossiers/:id/exercices`, scopé et servi aujourd'hui). ⚡ **3 ÉCARTS TROUVÉS EN CHEMIN, TOUS INVISIBLES À L'ÉCRAN** : (1) la **CI ne validait AUCUNE variable d'env requise** — les 2 jobs posaient `NEXT_PUBLIC_API_BASE_URL`, supprimée du schéma à FE-INT-0, donc une variable inconnue et zéro requise ; (2) le **`typecheck` était ROUGE sur `fe-059a`** (`e2e/dossiers-portefeuille.spec.ts` : l'étalement d'un `Record<string, unknown>` perd les clés du patch ⇒ `.id` ne compile pas — et les specs Playwright ne passent pas par Vitest, donc rien ne le disait) ; (3) le **sélecteur interrogeait `dossier-service` depuis les pages de CABINET** — les hooks s'exécutent avant tout `return`, donc `useDossiers()` partait même quand le composant ne rendait rien : **attrapé par un test, invisible à l'œil**. ⚠️ COÛT PORTÉ AUX AUTRES : les **5 specs E2E de l'Atelier** stubbent désormais `dossier-service` et portent `?dossier=` (`e2e/utils/dossiers.ts`) — c'est le prix assumé : un écran de module atteignable sans dossier est ce qu'on vient de rendre impossible. ⚠️ `NEXT_PUBLIC_DOSSIER_URL` est **REQUISE** depuis cette story. ⚠️ Le `<Suspense>` du layout `(app)` n'est pas décoratif : `useSearchParams()` sans frontière fait échouer `next build` (pas `next dev`).  🆕 maquette validée (sélecteur de la barre du haut + bandeau de contexte de l'Atelier). **AMENDE FE-003 et FE-014.** ⚡ C'EST LA STORY QUI PORTE LE RISQUE Nº2 : elle rend le contexte impossible à ignorer — à l'écran, dans l'URL, et dans le cache. ⚠️ **L'URL est la SOURCE DE VÉRITÉ, pas le `localStorage`** (qui ne sert qu'au premier rendu) : sinon deux onglets ouverts sur deux dossiers finissent par se contaminer. ⚠️ **`dossierId` doit être le PREMIER segment de toute clé TanStack Query** — en fin de clé ça fonctionne aussi, mais l'invalidation par préfixe devient impossible, et c'est elle qui rend l'AC de purge tenable en une ligne au lieu de trente. ⚠️ **NE JAMAIS dériver le dossier du jeton** : le JWT porte l'organisation, jamais le dossier — l'inférer ramènerait « une org = une société » par la porte de derrière. ⚠️ Le sélecteur est une CAPACITÉ DÉCLARÉE du shell config-driven : le distributeur, qui n'a pas de dossiers, ne doit pas en hériter." }
      - { id: "FE-060", app: "client", title: "Assistant « Nouveau dossier client » — dépôt + OCR → identité → pays & référentiel → récapitulatif + attestation de mandat", epic: "FE-EPIC-008", points: 8, status: "review", backend_ready: "done", backend_ref: "STORY-301,302,304,354,353,355,081", note: "✅ **LIVRÉE le 2026-08-19** ⬆️ **2ᵉ PASSE DU 2026-08-19 — DEUX CORRECTIONS, DONT UNE DE MON PROPRE DIAGNOSTIC.** ① ⚡ **L'OCR DE L'ÉTAPE 1 EST LIVRÉ : LA SURFACE ÉTAIT SERVIE DEPUIS TROIS SEMAINES ET PERSONNE NE L'APPELAIT.** Ma 1ʳᵉ passe l'avait déclarée absente — **c'était FAUX** : j'avais regardé `document-service`, dont le `ProfilExtractionController` n'expose qu'un `@Post()` et pousse par Kafka, alors que le **read-model est chez `balance-service`**, qui l'expose (`POST /profil-societe/ocr`, les 2 pièces en UN appel + `GET /profil-societe/ocr/:extractionId`). **STORY-081 est `done` depuis le 2026-07-27.** ⇒ **RÈGLE : « aucune route ne rend ça » se vérifie chez TOUS les consommateurs de l'événement, jamais seulement chez le producteur** — symétrique exact du défaut « une écriture sans lecture ne se signale nulle part », que ce dépôt documente déjà 3 fois. ⚠️ **FE-041 n'était donc PAS le bloqueur** que sa fiche laissait croire. ⚠️ **4 CONVERSIONS DÉCIDENT DU SUCCÈS, toutes en fonctions pures testées** : l'OCR émet `nif` quand le contrat attend **`nifSociete`** (une fusion par nom de clé perdrait LE champ dont dépend tout l'AC-3, en silence) ; `dirigeant` est **singulier** et vise `dirigeants[0].nom` ; la forme juridique arrive **en clair** (« Société à responsabilité limitée » → `SARL`, sinon 400 — et on **ne devine JAMAIS vers `AUTRE`**, une valeur fausse et plausible traverse la relecture) ; la date arrive au format togolais (`14/03/2019` → `2019-03-14`, sinon un `<input type=date>` reste **VIDE** et l'OCR paraît n'avoir rien lu). ⚠️ **`@RequiresBalanceAccess` sur les routes OCR, PAS sur `POST /dossiers`** ⇒ un cabinet sans le module Balance **crée quand même des dossiers** : l'extraction se GREFFE, son 403 est rendu comme un cas NOMINAL, et la saisie manuelle reste le chemin toujours disponible. ⚠️ **DO-1 tenu par construction** : l'application **ne remplace jamais** une valeur déjà saisie (l'extraction est asynchrone, quelqu'un a pu taper pendant), n'est faite **qu'une fois** (le polling repasse), et la provenance est **dérivée du serveur** (`faibleConfiance`), jamais d'un seuil rejoué côté client — un **conflit** vaut « À confirmer », jamais « Extrait ». ⛔ **Reste à FE-064** : *conserver* la pièce dans le dossier. `POST /profil-societe/ocr` ne prend pas de `dossierId` — le dossier n'existe pas encore quand on dépose. **STORY-358 a été LIVRÉE le 2026-08-19** ⇒ **le backend de FE-064 est prêt, l'écran reste à faire.** ② ⚠️ **AC-10 AJOUTÉ — le 403 pré-absorbe STORY-363.** `dossier-service` est le SEUL service métier sans gate KYC ; STORY-363 l'ajoute et sa fiche impose de la livrer « AVANT ou AVEC » ce sprint frontend. Traduire tout 403 par « réservé à l'administrateur » enverrait quelqu'un demander un DROIT quand ce qui manque est l'APPROBATION KYC — deux gestes, deux écrans. ⇒ le `code` est lu d'abord, le repli sur le rôle ne vaut que pour un 403 SANS code. **Défaut d'AP-26 pris à l'avance : le jour où 363 tombe, l'écran est déjà juste.** ③ ⚠️ **UN E2E A TROUVÉ UN DÉFAUT D'ACCESSIBILITÉ, PAS UN DÉFAUT DE TEST** : `getByLabel(« Forme juridique »)` résolvait **2 éléments** — le sélecteur, et le champ « Fonction » dont le texte d'aide contient ces mots. Cause réelle : **l'aide vivait DANS le `<label>`, donc dans le NOM ACCESSIBLE du champ** — un lecteur d'écran annonçait « Fonction Champ libre — la proposition suit la forme juridique… » comme *nom*. Playwright suggérait `{ exact: true }` ; **le corriger côté test aurait laissé le défaut au produit**. ⇒ l'aide passe en `aria-describedby`, hors du label (un nom nomme, une description décrit). ⇒ **RÈGLE : quand un sélecteur de test devient ambigu, se demander d'abord si c'est l'ACCESSIBILITÉ qui est ambiguë.** ✅ Gates rejoués : typecheck · lint 0 warning · **90 fichiers / 695 unitaires** (+36) · **113/115 E2E**, dont les **9 de la story** — ⚠️ les 2 rouges PRÉEXISTENT sur `origin/dev` (`atelier-scope-dossier:252`/`:304`). ⚠️ **DEUX FAUX ROUGES DE CONTENTION, ET L'UN NE RESSEMBLAIT PAS À UN TIMEOUT** : 8 échecs à 5000 ms pile (dont 4 dans des fichiers non touchés) + **1 en 1 s sur « Unable to find a label with the text of… Statuts »** — un message qui ACCUSE LE COMPOSANT alors que le défaut était le timing du test sous charge. Durci en `findBy*` + attente d'activation. ⇒ **la contention ne se présente pas toujours en délai dépassé.** ⚠️ **Les « 3 errors » d'un run intermédiaire = le BARREL-GENERATOR** (87 fichiers chargés sur 90) : purger avant TOUTE exécution, pas seulement avant typecheck/build. — Historique 1ʳᵉ passe —  — branche `fe-060` partie d'`origin/dev` à `78e3dff`, 2 commits poussés (`aca5a63`, `9af51a6`). ⏳ PR à ouvrir à la main (`gh` absent du poste). ⚡ **C'EST LA PREMIÈRE ÉCRITURE DU FRONT VERS `dossier-service`** : le service exposait **7 routes d'écriture** et le front n'en consommait **AUCUNE** — une org n'avait qu'un dossier (« Mon cabinet », rejeu d'événement, D1) et un cabinet ne pouvait pas ajouter un client. Cette story en consomme **3** (`POST /dossiers`, `PATCH …/affectation`, `POST …/exercices`) ; **il en reste 4** : `archiver`/`reactiver` → **FE-061**, `exercices/clore`/`rouvrir` → **FE-066**, toutes deux `ready-for-dev` backend `done`. 🏁 **INTEGRATION GATE FAIT, EN VRAI NAVIGATEUR** (stack docker, :3100 → :3009, aucun stub, login réel via le BFF) : création `201`, **doublon de NIF PROVOQUÉ** → `409` portant `details.dossierId` + `details.raisonSociale`, renvoi suivi jusqu'à la fiche ; `PATCH …/affectation` `200` (version 1→2) ; `POST …/exercices` bornes irrégulières `201` `dureeEnJours: 292` — **la même valeur que le calcul client** ; **0 erreur CORS**, préflight `OPTIONS` vérifié pour POST ET PATCH. ⛔ **9 ÉCARTS ENTRE LA MAQUETTE VALIDÉE ET LE CONTRAT SERVI**, tous tranchés en faveur du servi : SNC/SCI et « Distributeur » n'existent pas dans les `enum` (400) · 7 des 8 pays de la maquette non plus (`PAYS_NON_SUPPORTE`, **prouvé en live sur `BJ`**) · **les 2 AXES NE SONT PAS ENVOYABLES** (`CreerDossierDto` ne les expose pas — **prouvé en live** : `400 « property systemeComptable should not exist »`) ⇒ **FE-065** · l'OCR de l'étape 1 n'est servi par rien (FE-041 `blocked`, FE-064/STORY-358 `not_started`, **et aucun identifiant de pièce au contrat** : la note de la fiche « garder les ids et les passer à la création » était **inapplicable**) · `ActionnaireDto` exige `parts` ET `pourcentage` ET `type`, la maquette n'avait qu'une colonne · `DirigeantDto` n'a NI nationalité NI n° de pièce, contrairement à ce que la maquette montrait. ⚠️ **DEUX ERREURS DE FICHE CORRIGÉES** : ① l'AC-3 écrit `NIF_DEJA_UTILISE`, **le code réel est `DOSSIER_NIF_DEJA_UTILISE`** — un écran branché sur le nom de la fiche n'aurait JAMAIS reconnu le conflit et serait retombé sur le message générique, *soit exactement le défaut que l'AC interdit, avec l'AC comme cause* (un test verrouille les deux sens) ; ② **`GET /dossiers/:id/completude` N'EXISTE PAS** sur `:3009` — sans effet ici, **mais FE-061 s'appuie dessus et doit être réancrée avant d'être tirée**. ⚠️ **« Réutilise FE-040/041/042 » était FAUX** : les trois sont `blocked` et FE-063 a établi que l'ordre qui les précédait ne reposait sur rien. Il n'y avait **rien** à réutiliser — l'assistant porte lui-même l'identité et le type/pays. **AC-6 devient SANS OBJET** (aucun axe à faire diverger). ⚡ **PIÈGE TROUVÉ, ET IL SE RÉPÈTE DANS 3 COUCHES** : « tout ce qui suit `/dossiers/` est un identifiant » est **faux**. `/dossiers/nouveau` était résolu en `dossierId: 'nouveau'` ⇒ `GET /dossiers/nouveau` (404 garanti) + sélecteur de dossier actif affiché sur l'écran où l'on n'en a pas encore. C'est le **pendant exact** de l'avertissement que `dossier-service` porte en tête de son contrôleur (« toute route littérale ajoutée par la suite devra l'être aussi »). Et le même défaut est réapparu **dans un locator de test** : `a[href^='/dossiers/']` comptait 4 dossiers là où le serveur en sert 3 — il **faussait l'assertion de PORTÉE de FE-059a**, la plus importante de cet écran. ⇒ `SEGMENTS_RESERVES` : toute page littérale sous `/dossiers` doit y être inscrite. ⚠️ **La création est une SÉQUENCE de 3 appels, pas une transaction** (`CreerDossierDto` ne porte ni responsable ni bornes d'exercice) : un échec de suite laisse un dossier **RÉEL**, que l'écran nomme en interdisant de recréer — un doublon que le contrôle de NIF n'attraperait pas s'il n'y a pas de NIF. ✅ Gates : typecheck · lint 0 warning · build · **659 unitaires** (57 neufs, sérialisés) · **8 E2E** neufs · suite E2E **111/114** — ⚠️ **les 3 rouges PRÉEXISTENT sur `origin/dev`** (vérifié par checkout : `atelier-scope-dossier:252` et `:304`, l'Integration Gate de FE-063). **AC-7 et AC-8 prouvés PAR MUTATION**, pas seulement au vert." }
      - { id: "FE-066", app: "client", title: "Les exercices du dossier — lister, clore explicitement, rouvrir, reprendre un exercice antérieur en `MIGRATION`", epic: "FE-EPIC-008", points: 5, status: "ready-for-dev", backend_ready: "done", backend_ref: "STORY-355", note: "🔓 **DÉBLOQUÉE LE 2026-08-14 — STORY-355 est mergée ce jour** (3 PR ensemble : `dossier-service#6` producteur, `balance-service#36` et `bilan-service#40` read-models). **REMPLACE FE-029, QUI EST SUPPRIMÉE** : FE-029 écrivait un CRUD sur `POST /bilan/exercices`, or l'exercice appartient au dossier. L'écran reste, sa SOURCE change ⇒ `GET|POST /dossiers/:dossierId/exercices`. ⚡ DEUX MODÈLES SE CONTREDISAIENT — `ExerciceAtelier` (CLOS terminal, clôture en EFFET DE BORD de la reprise) vs `Exercice` du Bilan (CRUD + rouvrir) : « l'exercice 2023 est-il clos ? » avait DEUX RÉPONSES selon le service. Q6 : le DOSSIER fait foi, les deux autres deviennent des read-models. ⚠️ Q8 : un seul exercice ouvert à la fois — **l'UI NE PRÉ-CONTRÔLE PAS** (l'invariant est un index unique partiel côté serveur), elle rend le `409 EXERCICE_DEJA_OUVERT` en NOMMANT l'exercice bloquant. ⚠️ Q7 : un exercice antérieur à l'entrée en portefeuille est ajoutable en `origine: MIGRATION`, consultable, SANS liasse Prospera — et **il naît CLOS et ne se rouvre pas**. ⚠️ Bornes LIBRES : ne réinventer AUCUNE règle de calendrier — un contrôle client « 12 mois » rendrait impossible le 1ᵉʳ exercice d'une société créée en mars. ⚠️ `libelle` et `dureeEnJours` sont DÉRIVÉS côté serveur, non saisissables (whitelist stricte ⇒ 400). ⚠️ **La propagation vers balance/bilan est ASYNCHRONE (outbox)** : l'e2e doit vérifier que l'Atelier REFUSE d'écrire tant que la projection n'a pas convergé, jamais supposer l'instantanéité." }
      - { id: "FE-061", app: "client", title: "Le dossier ouvert — fiche, référentiel effectif nommé et versionné, affectation responsable/contributeurs, archivage", epic: "FE-EPIC-008", points: 5, status: "ready-for-dev", backend_ready: "done", backend_ref: "STORY-301,353,304", note: "⛔ **RÉANCRAGE FE-060 (2026-08-19) — `GET /dossiers/:id/completude` N'EXISTE PAS** : vérifié sur l'OpenAPI VIVANT de `:3009` (9 chemins). La fiche de FE-060 la nommait, celle de FE-061 s'appuie dessus pour « ce qui manque au dossier » — **à réancrer AVANT de tirer la story**, sinon elle sera codée contre une route imaginaire. ⚡ **FE-060 a consommé 3 des 7 routes d'écriture ; les 2 de cette story (`archiver`, `reactiver`) restent NON CONSOMMÉES.** — 🆕 maquette validée (sous-vue dossier ouvert). ⚡ PRÉCISION PO, mot pour mot : « ainsi dans son dossier client on a toutes les informations » — le dossier est le POINT DE CONVERGENCE, pas un identifiant. Livre les 3 actes qui n'ont aucune surface aujourd'hui : affecter, archiver, réactiver. ⚠️ D11/D13 : « Mon cabinet » n'est ni affectable ni archivable, et INVISIBLE d'un collaborateur — la règle vit dans la portée serveur, l'UI ne la compense pas. ⚠️ **404 et NON 403 pour un non-affecté** : le backend refuse délibérément de révéler l'existence du dossier ; afficher « accès refusé » déferait ce choix. ⚠️ D12/Q12 : le collaborateur PEUT modifier largement — **NE PAS inventer ici une liste de champs interdits que le serveur n'applique pas** ; ce qui encadre est la traçabilité de FE-068. ⚠️ `If-Match` RÉELLEMENT envoyé — AP-26 documente ce que coûte son absence : toutes les approbations KYC cassées silencieusement pendant une semaine." }
      - { id: "AP-19", app: "admin", title: "Distinguer « n'a pas encore déposé » de « ne PEUT pas déposer » — l'état de vérification dans l'annuaire, la fiche et le tableau de bord", epic: "AP-EPIC-001", points: 3, status: "ready-for-dev", backend_ready: "done", backend_ref: "STORY-186", note: "🔓 **DÉBLOQUÉE — STORY-186 est `done` le 2026-08-12** (auth 829 unit / 205 e2e ; bff 420 unit / 189 e2e). Elle était `blocked` au S19. DÉCOUVERTE PAR L'e2e CHAÎNE KYC D'AP-07, lancé pour la 1ʳᵉ fois contre le stack : un cabinet qui ne vérifie pas son adresse ne peut RIEN déposer (`kyc-service` refuse `403 EMAIL_NOT_VERIFIED` sur `POST /kyc/documents` ET sur `GET /kyc/status`). Son dossier n'existe donc jamais et la console affiche une cohorte entière comme « en attente de dépôt », indistinguable de celle qui traîne. ⚠️ PREMIER ACTE : vérifier par un APPEL RÉEL que la donnée est bien servie avant d'écrire du TSX — leçon AP-INT-1." }
