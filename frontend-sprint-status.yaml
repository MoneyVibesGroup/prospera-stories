rio ② de la vérif docker de 147. ⚠️ À FAIRE APRÈS LE MERGE DE FE-027 (la story touche `balance-detail-view.tsx`, que FE-027 vient de créer). ⚠️ NE PAS traiter en rechercher-remplacer : côté backend le renommage a RÉVÉLÉ deux lectures de la mauvaise grandeur (rapprochement bancaire comparant un solde au net des mouvements ; CA du régime fiscal juste par coïncidence) — `balance-calculs.ts` et `saisie-model.ts` ont la même exposition. — PÉRIMÈTRE D'ORIGINE (2026-07-31, absorbé) : solde les écarts que FE-024 et FE-025 avaient TRACÉS SANS PORTEUR. Trois objets, tous avec leur backend livré : (1) **STORY-138 `done`** (403 e-mail auto-descriptif, `code: EMAIL_NOT_VERIFIED` déployé sur les 7 relying-parties) ⇒ le gate de FE-024 peut enfin distinguer les trois motifs de refus par leur `code` au lieu d'en deviner un sur trois — c'était l'écart n°1 de FE-024 ; (2) **`mappingProfile` → `profilImportId`** (STORY-088) : renommage de contrat, les types générés de :3007 sont périmés — rien n'est cassé (FE-025 n'envoyait pas le champ) mais le contrat généré ment ; (3) **`referentiel`/`paquetFiscal`/`stamp` typés `Record<string,never>`** dans les types générés (écart n°3 de FE-024) — à revérifier après régénération, et à ouvrir en ticket backend s'ils sont toujours non typés à l'OpenAPI. ⚠️ Même piège que FE-055 : rebâtir l'image balance-service sur origin/dev AVANT `gen:api`, sinon on régénère depuis un stack périmé (précédent avéré en FE-INT-0). AUCUN écran neuf. ⚡ L'écart n°2 de FE-024 (registre `atelier` vs `balance`) est DÉJÀ corrigé — commit `FE-024 corrige la clé de jointure du module Atelier : \\`balance\\`, pas \\`atelier\\`` mergé dans dev." }
