precationDate` était SERVIE PAR LE DTO et jetée par `toReferentiel` depuis STORY-032. 🔧 Point de bascule unique `TARGETS_SERVED` : le jour où le ticket backend est repris, la console se rallume en UNE ligne (il y avait six `mod.targets?.[scenario]` dans trois fichiers). 🎨 Maquette republiée — ⚠️ **URL NEUVE** (https://claude.ai/code/artifact/3783c8a0-6d79-483e-a2fc-7556fff2d312) : la maquette de la console n'avait JAMAIS été publiée en Artifact, la consigne « même URL » n'avait pas de cible ; c'est celle-ci que les prochaines AP doivent reprendre. — HISTORIQUE : ⚡ **DÉPLACÉE DU S10 AU S9 le 2026-08-06** — même thème que AP-12 et AP-20, et c'est le cas le plus net des trois : le code d'appel EXISTE DÉJÀ (`useToggleReferentielStatus`, `useDeprecateVersion`, `useRetireVersion` — écrits, testés, câblés au vrai service depuis AP-INT-0) et AUCUN composant ne les monte. Ce n'est pas du développement, c'est du raccordement. ⚠️ Le point (2) — le sélecteur t3/t5/t7 sur `mod.targets`, que `toCatalogModule` ne renseigne jamais — appelle une DÉCISION PO, pas du code : retirer (recommandé) ou garder derrière un encart « à livrer ». La trancher AVANT d'ouvrir la branche. — HISTORIQUE : NOUVELLE 2026-08-06 — RÈGLE PO : « je ne veux pas voir dans le code frontend un truc affiché s'il n'y a pas d'API, sauf si la story backend n'est pas présente ». DEUX VIOLATIONS, toutes deux au catalogue (l'annuaire des organisations est propre — tous ses éléments interactifs appellent le serveur). (1) catalog-view.tsx:166 passe onSelect={() => undefined} à ReferentielsTable, alors que la ligne porte role=button, tabIndex=0, cursor-pointer ET aria-label « Ouvrir le référentiel » : un lecteur d'écran annonce une porte qui n'existe pas. Or la route EXISTE — useToggleReferentielStatus est écrit, testé, câblé au vrai service, et utilisé par AUCUN composant ; idem useDeprecateVersion et useRetireVersion. Trois hooks de mutation, zéro bouton, alors qu'AP-04 dit « CRUD ». (2) Le sélecteur de scénario t3/t5