OpenAPI servi : POST|DELETE /organizations/me/logo + brandColor ; sanitizer SVG durci en 3 passes de revue sécurité). L'UI garde son propre garde-fou : logo rendu via <img> uniquement, jamais de SVG inline. Historique : 🆕 2026-07-22 (demande PO). OrganizationResponseDto porte id/name/slug/phone/country/address/status : NI logo NI couleur, et aucune route d'upload. ⚠️ garde-fou de périmètre acté : la couleur habille le logo par défaut et les DOCUMENTS PRODUITS, elle ne repeint pas la navigation de Prospera. ⚠️ si le backend accepte les SVG, ne jamais les injecter en ligne dans le DOM." }

  # ── S5 : allumer un module — LA boucle qui justifie toute la topologie ─────────────────
  #   ⚡ POURQUOI AP-05 ET FE-014 SONT DANS LE MÊME SPRINT : l'octroi et l'allumage sont les deux
  #   moitiés d'UNE seule preuve (admin grant → entitlement.changed → le module apparaît côté client).
  #   Les séparer = livrer deux demi-fonctionnalités dont aucune n'est démontrable seule. C'est
  #   l'illustration la plus nette du principe 0.
  - sprint_number: 5
    name: "Allumer un module : catalogue + entitlements (admin) ⇄ shell config-driven (client)"
    status: "in-progress"  # 🔄 2026-07-31 : moitié cliente livrée (FE-014 mergée) ; AP-04 et AP-05 restent, AP-05 étant REDEVENUE `ready-for-dev` (STORY-143). Même diagnostic qu'au S4 : la boucle attend AP-01.
    committed_points: 18
    goal: "DÉMO DE BOUCLE : l'admin octroie l'entitlement `bilan` à l'org Money Vibes → entitlement.changed → l'app cliente affiche le module. C'est la preuve du dogfooding DG-1 ET de la topologie config-driven (Option B)."
    backend_dependency: "AUCUNE — platform-catalog EPIC-007 (031→034) clos + admin-panel 048 done"
    stories:
      - { id: "AP-04", app: "admin", title: "Catalogue : CRUD Module/ModuleVersion/ReferentielVersion + garde-fou N/N-1 + checksum", epic: "AP-EPIC-002", points: 5, status: "review", backend_ready: "done", backend_ref: "STORY-032", note: "✅ LIVRÉE — mergée dans `dev` (PR #3, commits `d22c0c4`→`64e13f4`). Écrans Modules / Versions / Référentiels, les 18 modules Prospera réels inscrits, garde-fou N/N-1 et contrôle d'intégrité des paquets. ⚡ AMENDÉE LE 2026-07-31 (commit `a714afe`, PR #4) : le référentiel devient CONDITIONNEL au module — `referentielFamilies` au catalogue, sélecteur restreint aux familles que le module sait lire, et `grantableModules` remplacé par `notGrantableReason` (le sélecteur affiche TOUT le catalogue et NOMME ce qui bloque, au lieu de faire disparaître des modules sans explication). Motif : sur 18 modules, ONZE n'ont aucune notion de plan comptable — leur imposer un référentiel inscrit dans le droit une norme que personne n'a choisie et qu'un audit lira comme un choix. Backend à faire suivre = **STORY-148**. + dépôt d'un paquet : sha256 calculé dans le NAVIGATEUR et pré-rempli, repli manuel en contexte non sécurisé ; le fichier n'est PAS téléversé (aucune route de dépôt côté service = **STORY-149**) et l'écran le dit. ⚠️ SUR FIXTURES (`catalog-client.ts`) — cf. entête v3.3.0." }
      - { id: "AP-05", app: "admin", title: "Entitlements : grant/update/revoke (module × org × référentiel) + réconciliation (allume un module dans l'app cliente)", epic: "AP-EPIC-002", points: 5, status: "review", backend_ready: "done", backend_ref: "STORY-033,034,048,105,143", note: "✅ POUSSÉE ET MERGÉE le 2026-07-31 — PR #4 `ap-05`→`dev`, `dev` à `111e3b1`. ⚠️ ANNULE la note « NON POUSSÉE » posée quelques heures plus tôt le même jour : elle était exacte au moment où elle a été écrite (le code n'existait qu'en local sur `ap-05`, rien n'était relisible par l'équipe) et elle a cessé de l'être dans la journée. ÉCART DE CONTRAT ASSUMÉ introduit ici : `referentielCode`/`referentielVersion` deviennent OPTIONNELS côté front alors que le backend les exige encore — sans effet aujourd'hui (les deux seuls modules octroyables en exigent un), refermé par **STORY-148**. ⚠️ SUR FIXTURES (`entitlements-client.ts`) : la note historique ci-dessous affirme que la carte « lit le service en direct » — c'était l'INTENTION de conception, pas l'état du code ; aucun `apiFetch` métier n'existe dans ce dépôt. La boucle DG-1 n'est donc pas démontrable et FE-017 reste bloquée. ⚡ STORY-143 est LIVRÉE depuis (S18 backend clos), ce qui reconfirme le déblocage par une SECONDE voie — son incrément 1 ajoute le pass-through de lecture au BFF ; la v3.2.0 du tracker annonçait donc AP-05 `ready-for-dev` en ignorant que le code était déjà écrit. Les deux versions du tracker avaient chacune une moitié de la vérité. — DÉTAIL DU TRAVAIL RÉALISÉ EN LOCAL : ✅ LIVRÉE 2026-07-28 sur la branche `ap-05` (maquette validée PO AVANT code, intégrée au prototype cumulatif). CŒUR : la réconciliation est L'ÉCART, pas la liste — `reconciliation.ts` confronte chaque droit au catalogue DU JOUR et distingue `broken` (le client échoue déjà) de `warning` (agir, mais rien n'est cassé). 6 écarts détectés, chacun nommant sa conséquence client ; un droit RÉVOQUÉ n'est pas confronté (du bruit qui masquerait les vrais écarts). `unverified` RESTE octroyable (absence de preuve ≠ preuve d'un défaut) ; seul `compromised` sort du sélecteur. Un seul formulaire pour octroyer ET mettre à jour (PUT idempotent, 201/200 distingués). ⚠️ 2 ÉCARTS ASSUMÉS vs AP-02 : (a) la carte ne sert plus le `lastKnown` de l'agrégat dégradé — elle est ACTIONNABLE et lit le service en direct, servir un instantané périmé laisserait octroyer sur un état qui n'existe plus ; (b) une lecture en ÉCHEC n'est pas un état vide — l'écran dit l'échec et SUSPEND l'octroi, au lieu de dire « aucun droit » sur une ignorance. PREUVES : 185 tests / 29 fichiers (39 pour la feature), tsc 0, eslint 0, prettier propre, build OK. — HISTORIQUE : ✅ DÉBLOQUÉE 2026-07-28 — ANNULE ET REMPLACE la requalification `blocked (backend)` posée LE MÊME JOUR, qui ÉTAIT FAUSSE. Le motif invoqué (« le BFF ne proxifie aucune lecture d'entitlement ») était exact mais SANS PORTÉE : ce front ne passe pas par le BFF. Vérifié dans frontend-admin-panel/src/lib/api/services.ts — routage DIRECT-PAR-SERVICE (gateway option B, FE-INT-0) : le préfixe /catalog résout vers NEXT_PUBLIC_CATALOG_URL avec strip:false, donc /catalog/entitlements/:orgId part sur {CATALOG}/api/v1/catalog/entitlements/:orgId. Et les 4 routes EXISTENT — vérifié sur origin/dev de prospera-platform-catalog-service, entitlements.controller.ts, @Controller(catalog/entitlements) : PUT :orgId/:moduleCode (@RequirePermissions ENTITLEMENT_GRANT, idempotent 201/200) · DELETE :orgId/:moduleCode (ENTITLEMENT_REVOKE) · GET :orgId (réconciliation, autorisation CONTEXTUELLE assertCanReadOrg → org:read côté plateforme) · GET :orgId/:moduleCode. ⚡ STORY-143 N'EST PAS une dépendance d'AP-05 : elle ajoute un pass-through au BFF, que ce front n'emprunte pas. 🪤 LEÇON — l'erreur ne vient pas d'une mauvaise lecture du BACKEND (celle-là était juste) mais d'avoir PRÉSUMÉ L'ARCHITECTURE DU FRONT au lieu de l'ouvrir. Avant de déclarer une story frontend bloquée par une route manquante, LIRE src/lib/api/services.ts du front concerné. C'est la même famille de piège que ce fichier documente déjà deux fois, appliquée cette fois au front. ⚠️ Vigilance d'implémentation : un référentiel au checksum non conforme n'est PAS octroyable (AP-04 isReferentielUsable) — l'exclure du sélecteur, sinon l'échec se produit chez le client au chargement du paquet, loin d'ici." }
      - { id: "FE-014", app: "client", title: "Accès modules & entitlements : home des modules + shell config-driven (n'affiche que les modules ACTIFS ; gate KYC/abonnement/entitlement)", epic: "FE-EPIC-006", points: 5, status: "review", backend_ready: "done", backend_ref: "STORY-014,033,034", note: "✅ LIVRÉE sur `dev` (commits `f2d97f2`/`a3d7cd2` « FE-014 Accueil : les modules du cabinet, pilotés par les entitlements »). — HISTORIQUE : ⬅️ déplacée du sprint 2 (v3.0.0). Lit GET /catalog/entitlements/:orgId — le TENANT_ADMIN lit SA propre org, l'anti-énumération est déjà en place côté backend (STORY-033). Gate KYC/sub via /tenant/state (FE-INT-3). Volet abonnement DÉGRADÉ = activation manuelle par l'admin (DG-1, paiement en S16)." }
